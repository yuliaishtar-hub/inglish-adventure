<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Story</title>
    <style>
        body {
            font-family: Arial, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        #game-container {
            background-color: #fff;
            border-radius: 30px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            min-height: 600px;
        }

        h1 {
            color: #ff6b6b;
            font-size: 42px;
            text-shadow: 2px 2px 0 #fff;
        }

        #lily-img {
            width: 150px;
            border-radius: 50%;
            border: 4px solid #4CAF50;
            margin: 20px auto;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        #story-text {
            font-size: 22px;
            color: #333;
            margin: 20px auto;
            padding: 15px;
            background: #f0f8ff;
            border: 2px solid #4CAF50;
            border-radius: 20px;
        }

        .location-btn {
            display: block;
            width: 85%;
            margin: 15px auto;
            padding: 15px;
            font-size: 20px;
            background-color: #f0f8ff;
            border: 3px solid #4CAF50;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        .location-btn:hover {
            background-color: #dcedc8;
            transform: scale(1.05);
        }

        .location-btn.gold {
            background-color: #fff8e1;
            border-color: #ffb300;
        }

        #story-btn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #2196F3;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            font-family: inherit;
            margin-bottom: 20px;
        }

        #next-btn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #4CAF50;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            font-family: inherit;
            display: none;
            margin-top: 20px;
        }

        #exit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #f44336;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            font-family: inherit;
            font-size: 16px;
        }

        #screen-numbers {
            display: none;
        }

        #number-image {
            font-size: 80px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        #number-answers {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .answer-btn {
            display: block;
            width: 85%;
            margin: 10px auto;
            padding: 15px;
            font-size: 20px;
            background-color: #eee;
            border: 2px solid #ccc;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
        }

        .answer-btn.correct {
            background-color: #a5d6a7;
            border-color: #4caf50;
        }

        .answer-btn.wrong {
            background-color: #ef9a9a;
            border-color: #f44336;
        }

        #feedback {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
            min-height: 25px;
        }

        #screen-final {
            display: none;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>School Story</h1>
        <button id="exit-btn" onclick="window.location.href='index.html'">✖</button>
        <img id="lily-img" src="https://yuliaishtar-hub.github.io/inglish-adventure/Lili.jpg" alt="Lily">
        
        <div id="screen-story">
            <div id="story-text"></div>
            <button id="story-btn" onclick="speakStory()">🎤 Listen</button>
            <button id="next-btn" onclick="nextQuestion()">Next ➡️</button>
        </div>
        
        <div id="screen-numbers">
            <div id="number-image"></div>
            <div id="number-answers"></div>
            <div id="feedback"></div>
            <button id="next-btn" onclick="nextQuestion()">Next ➡️</button>
        </div>
        
        <div id="screen-final">
            <div class="location-btn" onclick="window.location.href='index.html'">Back to Map</div>
        </div>
    </div>

    <script>
        const LILY_PITCH = 1.2;
        const LILY_RATE = 0.85;

        let lilyVoice = null;
        let currentQuestionIndex = 0;
        let correctAnswerText = "";

        const storyText = "Hello! I'm Lily! I go to school every day. This is my friend. His name is Jake. Hello, Jake! Hi, Lily! How are you? I'm fine, thank you! Let's go to class!";

        const questions = [
            { question: "What is it?", image: "1️⃣", options: ["One", "Two", "Three"], correctIndex: 0 },
            { question: "What is it?", image: "2️⃣", options: ["Two", "One", "Five"], correctIndex: 0 },
            { question: "What is it?", image: "3️⃣", options: ["Three", "Two", "Four"], correctIndex: 0 },
            { question: "What is it?", image: "5️⃣", options: ["Five", "Three", "Seven"], correctIndex: 0 },
            { question: "What is it?", image: "7️⃣", options: ["Seven", "Five", "Ten"], correctIndex: 0 }
        ];

        function setupVoice() {
            const voices = window.speechSynthesis.getVoices();
            for (let i = 0; i < voices.length; i++) {
                const v = voices[i];
                if (v.name.includes('Google UK English Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Female') || v.lang === 'en-US' || v.lang === 'en-GB') {
                    lilyVoice = v; break;
                }
            }
            if (!lilyVoice && voices.length > 0) { lilyVoice = voices[0]; }
            window.speechSynthesis.onvoiceschanged = function() {
                const voices = window.speechSynthesis.getVoices();
                for (let i = 0; i < voices.length; i++) {
                    const v = voices[i];
                    if (v.name.includes('Google UK English Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Female') || v.lang === 'en-US' || v.lang === 'en-GB') {
                        lilyVoice = v; break;
                    }
                }
            };
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = LILY_RATE;
            utterance.pitch = LILY_PITCH;
            utterance.volume = 1.0;
            if (lilyVoice) { utterance.voice = lilyVoice; }
            window.speechSynthesis.speak(utterance);
        }

        function speakStory() {
            speak(storyText);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex >= questions.length) {
                document.getElementById('screen-story').style.display = 'none';
                document.getElementById('screen-numbers').style.display = 'none';
                document.getElementById('screen-final').style.display = 'block';
                speak("Well done!");
                return;
            }
            
            const q = questions[currentQuestionIndex];
            correctAnswerText = q.options[q.correctIndex];
            document.getElementById('number-image').innerHTML = q.image;
            document.getElementById('feedback').innerText = "";
            
            const answersDiv = document.getElementById('number-answers');
            answersDiv.innerHTML = "";
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.className = 'answer-btn';
                btn.onclick = () => selectAnswer(index, btn);
                answersDiv.appendChild(btn);
            });
        }

        function selectAnswer(index, btn) {
            const buttons = document.querySelectorAll('.answer-btn');
            const q = questions[currentQuestionIndex];
            if (index === q.correctIndex) {
                buttons.forEach(b => b.disabled = true);
                btn.classList.add('correct');
                document.getElementById('feedback').innerText = "Great!";
                speak(correctAnswerText);
            } else {
                btn.classList.add('wrong');
                btn.disabled = true;
                document.getElementById('feedback').innerText = "Oops! Try again!";
            }
        }

        window.onload = function() {
            setupVoice();
            speak(storyText);
        };
    </script>
</body>
</html>
