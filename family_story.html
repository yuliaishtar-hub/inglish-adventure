<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Story</title>
    <style>
        body { font-family: 'Comic Sans MS', 'Comic Sans', cursive; background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); text-align: center; padding: 20px; margin: 0; }
        #game-container { background-color: #fff; border-radius: 30px; padding: 20px; max-width: 600px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); min-height: 600px; }
        h1 { color: #ff6b6b; font-size: 42px; text-shadow: 2px 2px 0 #fff; }
        
        #lily-img { width: 150px; border-radius: 50%; border: 4px solid #4CAF50; margin: 20px auto; display: block; }
        #welcome-text { font-size: 24px; color: #333; margin-bottom: 20px; }
        
        .location-btn { display: block; width: 85%; margin: 15px auto; padding: 15px; font-size: 20px; background-color: #f0f8ff; border: 3px solid #4CAF50; border-radius: 20px; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .location-btn:hover { background-color: #dcedc8; transform: scale(1.05); }
        
        #story-text { font-size: 22px; color: #333; margin-bottom: 20px; }
        #story-btn { padding: 15px 30px; font-size: 20px; background-color: #2196F3; border: none; border-radius: 20px; cursor: pointer; color: white; font-family: inherit; margin-bottom: 20px; }
        #next-btn { padding: 15px 30px; font-size: 20px; background-color: #4CAF50; border: none; border-radius: 20px; cursor: pointer; color: white; font-family: inherit; display: none; margin-top: 20px; }
        #exit-btn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; background-color: #f44336; border: none; border-radius: 20px; cursor: pointer; color: white; font-family: inherit; font-size: 16px; }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Family Story</h1>
        <button id="exit-btn" onclick="window.location.href='index.html'">✖</button>
        <img id="lily-img" src="https://yuliaishtar-hub.github.io/inglish-adventure/Lili.jpg" alt="Lily">
        
        <div id="screen-story">
            <div id="story-text"></div>
            <button id="story-btn" onclick="speakStory()">🎤 Listen</button>
            <button id="next-btn" onclick="nextQuestion()">Next ➡️</button>
        </div>
        
        <div id="screen-questions" style="display: none;">
            <div id="question-text"></div>
            <div id="answers"></div>
            <div id="feedback"></div>
            <button id="mic-btn" onclick="startListening()">🎤 Say it!</button>
            <button id="next-btn" onclick="nextQuestion()">Next ➡️</button>
        </div>
        
        <div id="screen-final" style="display: none;">
            <div class="location-btn" onclick="window.location.href='index.html'">Back to Map</div>
        </div>
    </div>

    <script>
        const LILY_PITCH = 1.2;
        const LILY_RATE = 0.85;

        let lilyVoice = null;
        let currentQuestionIndex = 0;
        let correctAnswerText = "";

        const storyText = "Hello! I'm Lily! This is my mummy. Her name is Anna. She is kind. This is my daddy. His name is Tom. He is funny. My grandma is nice. My grandpa is old. I love my family!";

        const questions = [
            { question: "Who is she?", image: "👩", options: ["She's my mum.", "She's my sister.", "She's my grandma."], correctIndex: 0 },
            { question: "Who is he?", image: "👴", options: ["He's my brother.", "He's my grandpa.", "He's my dad."], correctIndex: 1 },
            { question: "Who is he?", image: "👨", options: ["He's my daddy.", "He's my grandpa.", "He's my brother."], correctIndex: 0 },
            { question: "Who is she?", image: "👧", options: ["She's my mummy.", "She's my grandma.", "She's my sister."], correctIndex: 2 }
        ];

        function setupVoice() {
            const voices = window.speechSynthesis.getVoices();
            for (let i = 0; i < voices.length; i++) {
                const v = voices[i];
                if (v.name.includes('Google UK English Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Female') || v.lang === 'en-US' || v.lang === 'en-GB') {
                    lilyVoice = v; break;
                }
            }
            if (!lilyVoice && voices.length > 0) { lilyVoice = voices[0]; }
            window.speechSynthesis.onvoiceschanged = function() {
                const voices = window.speechSynthesis.getVoices();
                for (let i = 0; i < voices.length; i++) {
                    const v = voices[i];
                    if (v.name.includes('Google UK English Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Female') || v.lang === 'en-US' || v.lang === 'en-GB') {
                        lilyVoice = v; break;
                    }
                }
            };
        }

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = LILY_RATE;
            utterance.pitch = LILY_PITCH;
            utterance.volume = 1.0;
            if (lilyVoice) { utterance.voice = lilyVoice; }
            window.speechSynthesis.speak(utterance);
        }

        function speakStory() {
            speak(storyText);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex >= questions.length) {
                document.getElementById('screen-story').style.display = 'none';
                document.getElementById('screen-questions').style.display = 'none';
                document.getElementById('screen-final').style.display = 'block';
                speak("Well done!");
                return;
            }
            
            const q = questions[currentQuestionIndex];
            correctAnswerText = q.options[q.correctIndex];
            document.getElementById('question-text').innerHTML = q.image + "<br>" + q.question;
            document.getElementById('feedback').innerText = "";
            document.getElementById('mic-btn').style.display = 'none';
            
            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = "";
            
            q.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.className = 'location-btn';
                btn.onclick = () => selectAnswer(index, btn);
                answersDiv.appendChild(btn);
            });
        }

        function selectAnswer(index, btn) {
            const buttons = document.querySelectorAll('.location-btn');
            const q = questions[currentQuestionIndex];
            if (index === q.correctIndex) {
                buttons.forEach(b => b.disabled = true);
                btn.classList.add('correct');
                document.getElementById('feedback').innerText = "Great! Now say it aloud!";
                document.getElementById('mic-btn').style.display = 'inline-block';
                document.getElementById('next-btn').style.display = 'inline-block';
                speak(correctAnswerText);
            } else {
                btn.classList.add('wrong');
                btn.disabled = true;
                document.getElementById('feedback').innerText = "Oops! Try again!";
            }
        }

        function startListening() {
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('active');
            micBtn.innerText = "Listening...";
            
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            recognition.start();
            
            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript.toLowerCase();
                const cleanSpoken = spokenText.trim().replace(/[.,!?;:]/g, '');
                const cleanCorrect = correctAnswerText.toLowerCase().replace(/[.,!?;:]/g, '');
                
                if (cleanSpoken.includes(cleanCorrect) || cleanCorrect.includes(cleanSpoken)) {
                    micBtn.classList.remove('active');
                    micBtn.style.display = 'none';
                    document.getElementById('feedback').innerText = "Excellent!";
                    document.getElementById('next-btn').style.display = 'inline-block';
                } else {
                    micBtn.classList.remove('active');
                    micBtn.innerText = "🎤 Try Again";
                    document.getElementById('feedback').innerText = "Not quite. Listen again!";
                    speak(correctAnswerText);
                }
            };
            
            recognition.onerror = (event) => {
                micBtn.classList.remove('active');
                micBtn.innerText = "🎤 Say it!";
                alert("Microphone error: " + event.error + ". Please try again.");
            };
            
            recognition.onend = () => {
                if(micBtn.classList.contains('active')){
                    micBtn.classList.remove('active');
                    micBtn.innerText = "🎤 Say it!";
                }
            };
        }

        window.onload = function() {
            setupVoice();
            speak(storyText);
        };
    </script>
</body>
</html>
