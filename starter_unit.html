<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starter Unit - Welcome Back!</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        #game-container {
            background-color: #fff;
            border-radius: 30px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            min-height: 500px;
            position: relative;
        }

        h1 {
            color: #ff6b6b;
            font-size: 36px;
            text-shadow: 2px 2px 0 #fff;
            margin-top: 0;
        }

        #lily-img {
            width: 150px;
            border-radius: 50%;
            border: 4px solid #4CAF50;
            animation: float 3s ease-in-out infinite;
            margin: 10px auto;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .nav-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #eee;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            font-size: 16px;
        }

        .nav-btn:hover { background-color: #dcedc8; }

        .content-block {
            display: block;
            margin-top: 20px;
        }

        .question-text {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        .big-emoji {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .answer-btn {
            display: block;
            width: 90%;
            margin: 10px auto;
            padding: 15px;
            font-size: 24px;
            background-color: #f0f8ff;
            border: 3px solid #4CAF50;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.3s;
        }

        .answer-btn:hover {
            background-color: #dcedc8;
            transform: scale(1.05);
        }

        .answer-btn.correct {
            background-color: #a5d6a7;
            border-color: #4caf50;
        }

        .answer-btn.wrong {
            background-color: #ef9a9a;
            border-color: #f44336;
        }

        #feedback {
            font-size: 20px;
            font-weight: bold;
            color: #ff9800;
            min-height: 30px;
            margin-top: 10px;
        }

        #next-btn {
            display: none;
            padding: 15px 30px;
            font-size: 20px;
            background-color: #2196F3;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            font-family: inherit;
            margin: 20px auto;
        }

        #exit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Starter Unit</h1>
        <button class="nav-btn" onclick="window.history.back()">⬅️ Back</button>
        <button id="exit-btn" onclick="window.location.href='index.html'">✖</button>
        
        <img id="lily-img" src="https://yuliaishtar-hub.github.io/inglish-adventure/Lili.jpg" alt="Lily">
        <div id="feedback"></div>

        <div id="screen-welcome" class="content-block">
            <div class="question-text">Hello! Nice to see you again!</div>
            <button class="answer-btn" onclick="startLesson()">Start 🚀</button>
        </div>

        <div id="screen-colour" class="content-block" style="display: none;">
            <div class="big-emoji" id="colour-emoji">🔴</div>
            <div class="question-text" id="colour-question">What colour is it?</div>
            <div id="colour-answers"></div>
            <button id="next-btn" onclick="nextQuestion()">Next ➡️</button>
        </div>

        <div id="screen-number" class="content-block" style="display: none;">
            <div class="big-emoji" id="number-emoji">7️⃣</div>
            <div class="question-text" id="number-question">What number is it?</div>
            <div id="number-answers"></div>
        </div>

        <div id="screen-object" class="content-block" style="display: none;">
            <div class="big-emoji" id="object-emoji">☀️</div>
            <div class="question-text" id="object-question">What is it?</div>
            <div id="object-answers"></div>
        </div>

        <div id="screen-final" class="content-block" style="display: none;">
            <div class="question-text">Well done, Lily! 🎉</div>
            <button class="answer-btn" onclick="window.location.href='index.html'">Back to Map</button>
        </div>
    </div>

    <script>
        const LILY_PITCH = 1.2;
        const LILY_RATE = 0.85;

        // Данные для Starter Unit (цвета, цифры, предметы)
        const lessons = [
            {
                type: 'colour',
                questions: [
                    { emoji: '🔴', answer: 'Red' },
                    { emoji: '🔵', answer: 'Blue' },
                    { emoji: '🟡', answer: 'Yellow' },
                    { emoji: '🟢', answer: 'Green' },
                    { emoji: '⚫', answer: 'Black' }
                ]
            },
            {
                type: 'number',
                questions: [
                    { emoji: '1️⃣', answer: 'One' },
                    { emoji: '2️⃣', answer: 'Two' },
                    { emoji: '3️⃣', answer: 'Three' },
                    { emoji: '5️⃣', answer: 'Five' },
                    { emoji: '7️⃣', answer: 'Seven' }
                ]
            },
            {
                type: 'object',
                questions: [
                    { emoji: '☀️', answer: 'Sun' },
                    { emoji: '📕', answer: 'Book' },
                    { emoji: '🪑', answer: 'Chair' },
                    { emoji: '☂️', answer: 'Umbrella' },
                    { emoji: '🐶', answer: 'Dog' }
                ]
            }
        ];

        let currentLessonIndex = 0;
        let currentQuestionIndex = 0;

        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = LILY_RATE;
            utterance.pitch = LILY_PITCH;
            window.speechSynthesis.speak(utterance);
        }

        function startLesson() {
            document.getElementById('screen-welcome').style.display = 'none';
            speak("Hello! Nice to see you again!");
            loadQuestion();
        }

        function loadQuestion() {
            const lesson = lessons[currentLessonIndex];
            const question = lesson.questions[currentQuestionIndex];

            // Скрываем все экраны, показываем нужный
            document.getElementById('screen-colour').style.display = 'none';
            document.getElementById('screen-number').style.display = 'none';
            document.getElementById('screen-object').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('feedback').innerText = '';

            let screenId = 'screen-colour';
            if (lesson.type === 'number') screenId = 'screen-number';
            if (lesson.type === 'object') screenId = 'screen-object';

            const screen = document.getElementById(screenId);
            screen.style.display = 'block';

            // Устанавливаем эмодзи и вопрос
            const emojiEl = screen.querySelector('.big-emoji');
            const questionEl = screen.querySelector('.question-text');
            const answersEl = screen.querySelector('div[id*="-answers"]');

            emojiEl.innerText = question.emoji;
            questionEl.innerText = (lesson.type === 'colour') ? "What colour is it?" : (lesson.type === 'number') ? "What number is it?" : "What is it?";
            
            // Генерируем кнопки (правильный + 2 неправильных)
            let options = [question.answer];
            const allAnswers = lesson.questions.map(q => q.answer);
            while (options.length < 3) {
                const randomAnswer = allAnswers[Math.floor(Math.random() * allAnswers.length)];
                if (!options.includes(randomAnswer)) {
                    options.push(randomAnswer);
                }
            }
            // Перемешиваем
            options.sort(() => Math.random() - 0.5);

            answersEl.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.className = 'answer-btn';
                btn.onclick = () => checkAnswer(btn, option, question.answer);
                answersEl.appendChild(btn);
            });
        }

        function checkAnswer(btn, selected, correct) {
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct');
                document.getElementById('feedback').innerText = "Great!";
                speak(correct);
                document.getElementById('next-btn').style.display = 'inline-block';
            } else {
                btn.classList.add('wrong');
                speak("Try again!");
                document.getElementById('feedback').innerText = "Oops! Try again!";
                btn.disabled = false; 
                btn.onclick = () => { btn.classList.remove('wrong'); checkAnswer(btn, selected, correct); }
            }
        }

        function nextQuestion() {
            const lesson = lessons[currentLessonIndex];
            currentQuestionIndex++;
            if (currentQuestionIndex >= lesson.questions.length) {
                currentLessonIndex++;
                currentQuestionIndex = 0;
                if (currentLessonIndex < lessons.length) {
                    loadQuestion();
                } else {
                    // Все уроки пройдены
                    document.getElementById('screen-colour').style.display = 'none';
                    document.getElementById('screen-number').style.display = 'none';
                    document.getElementById('screen-object').style.display = 'none';
                    document.getElementById('screen-final').style.display = 'block';
                    speak("Well done! You are a star!");
                }
            } else {
                loadQuestion();
            }
        }
    </script>
</body>
</html>
