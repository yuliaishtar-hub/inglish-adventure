<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Adventure</title>
    <style>
        body {
            font-family: Arial, Verdana, sans-serif;
            background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        #game-container {
            background-color: #fff;
            border-radius: 30px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            min-height: 600px;
        }

        h1 {
            color: #ff6b6b;
            font-size: 42px;
            text-shadow: 2px 2px 0 #fff;
        }

        #welcome-lily {
            width: 200px;
            border-radius: 50%;
            border: 5px solid #ff6b6b;
            margin: 20px auto;
            display: block;
        }

        #welcome-text {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        .location-btn {
            display: block;
            width: 85%;
            margin: 15px auto;
            padding: 15px;
            font-size: 20px;
            background-color: #f0f8ff;
            border: 3px solid #4CAF50;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        .location-btn:hover {
            background-color: #dcedc8;
            transform: scale(1.05);
        }

        .location-btn.gold {
            background-color: #fff8e1;
            border-color: #ffb300;
        }

        #top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .nav-btn {
            padding: 10px 20px;
            background-color: #eee;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
        }

        #lily-img img {
            width: 150px;
            border-radius: 50%;
            border: 4px solid #4CAF50;
        }

        #map-lily {
            width: 120px;
            border-radius: 50%;
            border: 4px solid #4CAF50;
            margin: 10px auto;
            display: block;
        }

        #xp-bar {
            background-color: #eee;
            border-radius: 15px;
            height: 20px;
            width: 100%;
            margin-bottom: 10px;
            overflow: hidden;
        }

        #xp-fill {
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            height: 100%;
            width: 0;
            border-radius: 15px;
            transition: width 0.3s;
        }

        #crystal-count {
            font-size: 24px;
            font-weight: bold;
            color: #ff9800;
        }

        #question-text {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }

        #question-image {
            margin-bottom: 10px;
            font-size: 80px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }

        .answer-btn {
            display: block;
            width: 85%;
            margin: 10px auto;
            padding: 15px;
            font-size: 20px;
            background-color: #eee;
            border: 2px solid #ccc;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
        }

        .answer-btn.correct {
            background-color: #a5d6a7;
            border-color: #4caf50;
        }

        .answer-btn.wrong {
            background-color: #ef9a9a;
            border-color: #f44336;
        }

        #feedback {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
            min-height: 25px;
        }

        #mic-btn, #next-btn {
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            margin: 10px;
        }

        #mic-btn {
            background-color: #FFC107;
        }

        #mic-btn.active {
            background-color: #ff9800;
        }

        #next-btn {
            background-color: #2196F3;
            color: white;
        }

        #mini-game-screen h2 {
            color: #ff6b6b;
        }

        .mini-game-btn {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mini-game-select {
            padding: 15px 20px;
            font-size: 18px;
            background-color: #FFC107;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            margin: 5px;
        }

        .mini-game-select:hover {
            background-color: #ffb300;
        }

        .pair-game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .pair-card {
            background-color: #f0f8ff;
            border: 3px solid #4CAF50;
            border-radius: 20px;
            padding: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .pair-card:hover {
            background-color: #dcedc8;
        }

        .pair-card.matched {
            background-color: #a5d6a7;
            border-color: #4caf50;
        }

        .pair-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .pair-card .word {
            font-size: 18px;
            font-weight: bold;
            margin-top: 10px;
        }

        #exit-mini-game-btn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #2196F3;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            color: white;
            font-family: inherit;
            margin-top: 20px;
        }

        .letter-game {
            padding: 20px;
        }

        .letter-game .word-display {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
        }

        .letter-game .word-display .missing {
            color: #f44336;
        }

        .letter-btns {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .letter-btn {
            padding: 15px 25px;
            font-size: 24px;
            background-color: #eee;
            border: 2px solid #ccc;
            border-radius: 10px;
            cursor: pointer;
        }

        .letter-btn:hover {
            background-color: #dcedc8;
        }

        .letter-btn.correct {
            background-color: #a5d6a7;
            border-color: #4caf50;
        }

        .letter-btn.wrong {
            background-color: #ef9a9a;
            border-color: #f44336;
        }

        .letter-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Экран Приветствия -->
        <div id="welcome-screen">
            <h1>English Adventure</h1>
            <img id="welcome-lily" src="https://yuliaishtar-hub.github.io/inglish-adventure/Lili.jpg" alt="Lily">
            <div id="welcome-text">Hi! I'm Lily! Let's go on an adventure!</div>
            <button class="location-btn" onclick="showMap()">Start 🚀</button>
        </div>

        <!-- Экран Карты -->
        <div id="map-screen" style="display: none;">
            <h1>🗺️ Map</h1>
            <img id="map-lily" src="https://yuliaishtar-hub.github.io/inglish-adventure/Lili.jpg" alt="Lily">
            
            <button class="location-btn" onclick="startLevel('school')">🏫 School Days</button>
            <button class="location-btn gold" onclick="startGames('school')">🎮 School Game</button>
            <button class="location-btn" onclick="startLevel('family')">👨‍👩‍👧 Family</button>
            <button class="location-btn gold" onclick="startGames('family')">🎮 Family Game</button>
            <button class="location-btn" onclick="startLevel('animals')">🐾 Animals</button>
            <button class="location-btn gold" onclick="startGames('animals')">🎮 Animals Game</button>
            <button class="location-btn" onclick="startLevel('seasons')">🌦️ Seasons</button>
            <button class="location-btn gold" onclick="startGames('seasons')">🎮 Seasons Game</button>
            <button class="location-btn" onclick="startLevel('colours')">🎨 Colours</button>
            <button class="location-btn gold" onclick="startGames('colours')">🎮 Colours Game</button>
            <button class="location-btn" onclick="startLevel('toys')">🧸 Toys</button>
            <button class="location-btn gold" onclick="startGames('toys')">🎮 Toys Game</button>
            <button class="location-btn" onclick="startLevel('home')">🏡 Home</button>
            <button class="location-btn gold" onclick="startGames('home')">🎮 Home Game</button>
            <button class="location-btn" onclick="startLevel('food')">🍕 Food & Drinks</button>
            <button class="location-btn gold" onclick="startGames('food')">🎮 Food Game</button>
        </div>

        <!-- Экран Локации -->
        <div id="game-screen" style="display: none;">
            <div id="top-bar">
                <button class="nav-btn" onclick="goBackToMap()">⬅️ Map</button>
                <button class="nav-btn" onclick="window.location.reload()">🔄 Restart</button>
            </div>
            <h2 id="level-title">Level</h2>
            <div id="lily-img"><img src="https://yuliaishtar-hub.github.io/inglish-adventure/Lili.jpg" alt="Lily"></div>
            <div id="xp-bar"><div id="xp-fill"></div></div>
            <div id="crystal-count">💎 <span id="crystals">0</span></div>
            <div id="question-text">Loading...</div>
            <div id="question-image"></div>
            <div id="answers"></div>
            <div id="feedback"></div>
            <button id="mic-btn" onclick="startListening()">🎤 Say it!</button>
            <button id="next-btn" onclick="nextQuestion()">Next ➡️</button>
        </div>

        <!-- Экран Мини-игры -->
        <div id="mini-game-screen" style="display: none;">
            <h2 id="mini-game-title">Mini Game</h2>
            <div class="mini-game-btn">
                <button class="mini-game-select" onclick="startMiniGame('pair')">🃏 Найди пару</button>
                <button class="mini-game-select" onclick="startMiniGame('letter')">🔤 Вставь букву</button>
            </div>
            <div id="mini-game-content"></div>
            <div id="mini-game-result"></div>
            <button id="exit-mini-game-btn" onclick="exitMiniGame()">Back to Map</button>
        </div>
    </div>

    <script src="topics.js"></script>

    <script>
        // ---------- GAME DATA ----------
        let xp = 0;
        let crystals = 0;
        let currentLevelIndex = 0;
        let currentQuestion = {};
        let correctAnswerText = "";
        let currentLevelQuestions = [];
        let currentLevelName = "";
        let currentGameData = [];
        let miniGameIndex = 0;
        let miniGameScore = 0;
        let currentGameKey = "";
        let hasSpokenWelcome = false;

        // Настройки голоса
        let lilyVoice = null;
        const LILY_PITCH = 1.2;
        const LILY_RATE = 0.85;

        // ---------- INITIALIZATION ----------
        window.onload = function() {
            loadProgress();
            setupVoice();
            speakText("Hi! I'm Lily! Let's go on an adventure!", true);
        };

        function loadProgress() {
            if (localStorage.getItem('xp')) xp = parseInt(localStorage.getItem('xp'));
            if (localStorage.getItem('crystals')) crystals = parseInt(localStorage.getItem('crystals'));
            updateUI();
        }

        function saveProgress() {
            localStorage.setItem('xp', xp);
            localStorage.setItem('crystals', crystals);
        }

        function updateUI() {
            document.getElementById('xp-fill').style.width = (xp % 100) + '%';
            document.getElementById('crystals').innerText = crystals;
        }

        // ---------- VOICE SETUP ----------
        function setupVoice() {
            const voices = window.speechSynthesis.getVoices();
            for (let i = 0; i < voices.length; i++) {
                const v = voices[i];
                if (v.name.includes('Google UK English Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Female') || v.lang === 'en-US' || v.lang === 'en-GB') {
                    lilyVoice = v; break;
                }
            }
            if (!lilyVoice && voices.length > 0) { lilyVoice = voices[0]; }
            window.speechSynthesis.onvoiceschanged = function() {
                const voices = window.speechSynthesis.getVoices();
                for (let i = 0; i < voices.length; i++) {
                    const v = voices[i];
                    if (v.name.includes('Google UK English Female') || v.name.includes('Zira') || v.name.includes('Samantha') || v.name.includes('Female') || v.lang === 'en-US' || v.lang === 'en-GB') {
                        lilyVoice = v; break;
                    }
                }
            };
        }

        function speakText(text, slow = false) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = slow ? LILY_RATE : 1.0;
            utterance.pitch = LILY_PITCH;
            utterance.volume = 1.0;
            if (lilyVoice) { utterance.voice = lilyVoice; }
            window.speechSynthesis.speak(utterance);
        }

        // ---------- WELCOME & MAP ----------
        function showMap() {
            // Лили говорит только при ПЕРВОМ входе
            if (!hasSpokenWelcome) {
                speakText("Let's go on an adventure!", true);
                hasSpokenWelcome = true;
            }
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('map-screen').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('mini-game-screen').style.display = 'none';
        }

        function startLevel(levelKey) {
            currentLevelQuestions = allLevels[levelKey].questions;
            currentLevelName = allLevels[levelKey].name;
            document.getElementById('level-title').innerText = currentLevelName;
            speakText(currentLevelName.replace(/[^\w\s]/g, ''), true);
            document.getElementById('map-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('mini-game-screen').style.display = 'none';
            currentLevelIndex = 0;
            loadQuestion();
            updateUI();
        }

        function goBackToMap() {
            showMap();
            window.speechSynthesis.cancel();
        }

        // ---------- QUESTION LOGIC ----------
        function loadQuestion() {
            if (currentLevelIndex >= currentLevelQuestions.length) {
                showReviewScreen();
                return;
            }
            currentQuestion = currentLevelQuestions[currentLevelIndex];
            correctAnswerText = currentQuestion.options[currentQuestion.correctIndex];
            document.getElementById('question-text').innerHTML = currentQuestion.question;
            document.getElementById('question-image').innerHTML = "";
            document.getElementById('feedback').innerText = "";
            document.getElementById('mic-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            if (typeof currentQuestion.image === 'string' && currentQuestion.image.startsWith('http')) {
                document.getElementById('question-image').innerHTML = '<img src="' + currentQuestion.image + '" style="width: 120px; border-radius: 10px;">';
            } else {
                document.getElementById('question-image').innerHTML = currentQuestion.image;
            }
            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = "";
            currentQuestion.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.className = 'answer-btn';
                btn.onclick = () => selectAnswer(index, btn);
                answersDiv.appendChild(btn);
            });
        }

        function selectAnswer(index, btn) {
            const buttons = document.querySelectorAll('.answer-btn');
            if (index === currentQuestion.correctIndex) {
                buttons.forEach(b => b.disabled = true);
                btn.classList.add('correct');
                document.getElementById('feedback').innerHTML = "Great! Now say it aloud!";
                document.getElementById('feedback').style.color = '#4CAF50';
                document.getElementById('mic-btn').style.display = 'inline-block';
                document.getElementById('next-btn').style.display = 'inline-block';
                speakText(correctAnswerText, true);
            } else {
                btn.classList.add('wrong');
                btn.disabled = true;
                document.getElementById('feedback').innerHTML = "Oops! Try again!";
                document.getElementById('feedback').style.color = '#f44336';
            }
        }

        // ---------- VOICE LOGIC ----------
        function startListening() {
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('active');
            micBtn.innerText = "Listening...";
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            recognition.start();
            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript.toLowerCase();
                const cleanSpoken = spokenText.trim().replace(/[.,!?;:]/g, '');
                const cleanCorrect = correctAnswerText.toLowerCase().replace(/[.,!?;:]/g, '');
                if (cleanSpoken.includes(cleanCorrect) || cleanCorrect.includes(cleanSpoken)) {
                    xp += 10; crystals += 1; saveProgress(); updateUI();
                    micBtn.classList.remove('active');
                    micBtn.style.display = 'none';
                    document.getElementById('feedback').innerHTML = "Excellent! +10 XP!";
                    document.getElementById('feedback').style.color = '#4CAF50';
                    document.getElementById('next-btn').style.display = 'inline-block';
                } else {
                    micBtn.classList.remove('active');
                    micBtn.innerText = "🎤 Try Again";
                    document.getElementById('feedback').innerHTML = "Not quite. Listen to Lily and try again!";
                    document.getElementById('feedback').style.color = '#f44336';
                    speakText(correctAnswerText, true);
                }
            };
            recognition.onerror = (event) => {
                micBtn.classList.remove('active');
                micBtn.innerText = "🎤 Say it!";
                alert("Microphone error: " + event.error + ". Please try again.");
            };
            recognition.onend = () => {
                if(micBtn.classList.contains('active')){
                    micBtn.classList.remove('active');
                    micBtn.innerText = "🎤 Say it!";
                }
            };
        }

        // ---------- NEXT QUESTION ----------
        function nextQuestion() {
            currentLevelIndex++;
            loadQuestion();
        }

        // ---------- MINI GAME LOGIC ----------
        function startGames(levelKey) {
            currentGameKey = levelKey;
            currentGameData = allLevels[levelKey].questions;
            document.getElementById('map-screen').style.display = 'none';
            document.getElementById('mini-game-screen').style.display = 'block';
            document.getElementById('mini-game-result').innerText = "";
            startMiniGame('pair');
        }

        function exitMiniGame() {
            document.getElementById('mini-game-screen').style.display = 'none';
            document.getElementById('map-screen').style.display = 'block';
        }

        function startMiniGame(gameType) {
            if (gameType === 'pair') {
                loadPairGame();
            } else if (gameType === 'letter') {
                loadLetterGame();
            }
        }

        function loadPairGame() {
            const grid = document.getElementById('mini-game-content');
            grid.innerHTML = '<div class="pair-game-grid" id="pair-grid"></div>';
            const pairGrid = document.getElementById('pair-grid');
            
            const pairs = [];
            for (let i = 0; i < currentGameData.length; i++) {
                const q = currentGameData[i];
                const correctWord = q.options[q.correctIndex];
                let image = "";
                if (typeof q.image === 'string' && q.image.startsWith('http')) {
                    image = '<img src="' + q.image + '" style="width: 80px; height: 80px;">';
                } else {
                    image = q.image;
                }
                pairs.push({ image: image, word: correctWord });
            }
            
            const allCards = [];
            for (let i = 0; i < pairs.length; i++) {
                allCards.push({ type: 'image', value: pairs[i].image, pairId: i });
                allCards.push({ type: 'word', value: pairs[i].word, pairId: i });
            }
            for (let i = allCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [allCards[i], allCards[j]] = [allCards[j], allCards[i]];
            }
            
            let firstCard = null;
            let secondCard = null;
            let lockBoard = false;
            
            allCards.forEach((card) => {
                const cardElement = document.createElement('div');
                cardElement.className = 'pair-card';
                cardElement.dataset.pairId = card.pairId;
                cardElement.dataset.type = card.type;
                cardElement.dataset.value = card.value;
                
                if (card.type === 'image') {
                    cardElement.innerHTML = card.value;
                } else {
                    cardElement.innerHTML = '<div class="word">' + card.value + '</div>';
                }
                
                cardElement.onclick = () => {
                    if (lockBoard) return;
                    if (cardElement.classList.contains('matched')) return;
                    cardElement.classList.add('flipped');
                    
                    if (!firstCard) {
                        firstCard = cardElement;
                    } else if (!secondCard) {
                        secondCard = cardElement;
                        lockBoard = true;
                        
                        if (firstCard.dataset.pairId === secondCard.dataset.pairId) {
                            firstCard.classList.add('matched');
                            secondCard.classList.add('matched');
                            firstCard = null;
                            secondCard = null;
                            lockBoard = false;
                        } else {
                            setTimeout(() => {
                                firstCard.classList.remove('flipped');
                                secondCard.classList.remove('flipped');
                                firstCard = null;
                                secondCard = null;
                                lockBoard = false;
                            }, 1000);
                        }
                    }
                };
                pairGrid.appendChild(cardElement);
            });
        }

        // Игра 3: Вставь букву
        function loadLetterGame() {
            const content = document.getElementById('mini-game-content');
            content.innerHTML = '<div class="letter-game"></div>';
            const letterGame = document.querySelector('.letter-game');
            
            const q = currentGameData[miniGameIndex];
            const correctWord = q.options[q.correctIndex];
            const word = correctWord.toLowerCase();
            const letters = word.split('');
            
            // Случайно выбранная пропущенная буква
            const missingIndex = Math.floor(Math.random() * letters.length);
            const missingLetter = letters[missingIndex];
            const wordWithMissing = word.substring(0, missingIndex) + '_' + word.substring(missingIndex + 1);
            
            let image = "";
            if (typeof q.image === 'string' && q.image.startsWith('http')) {
                image = '<img src="' + q.image + '" style="width: 100px; border-radius: 10px;">';
            } else {
                image = q.image;
            }
            
            letterGame.innerHTML = image + '<div class="word-display">' + wordWithMissing + '</div>';
            
            // Буквы для выборки
            const lettersToChoose = [missingLetter];
            while (lettersToChoose.length < 3) {
                const randomLetter = String.fromCharCode(97 + Math.floor(Math.random() * 26));
                if (!lettersToChoose.includes(randomLetter)) {
                    lettersToChoose.push(randomLetter);
                }
            }
            
            for (let i = lettersToChoose.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [lettersToChoose[i], lettersToChoose[j]] = [lettersToChoose[j], lettersToChoose[i]];
            }
            
            const letterBtns = document.createElement('div');
            letterBtns.className = 'letter-btns';
            letterGame.appendChild(letterBtns);
            
            lettersToChoose.forEach((letter) => {
                const btn = document.createElement('button');
                btn.className = 'letter-btn';
                btn.innerText = letter;
                btn.onclick = () => {
                    if (letter === missingLetter) {
                        btn.classList.add('correct');
                        document.getElementById('mini-game-result').innerText = "Correct!";
                        miniGameScore++;
                        setTimeout(() => {
                            miniGameIndex++;
                            if (miniGameIndex >= currentGameData.length) {
                                document.getElementById('mini-game-result').innerText = "All correct!";
                            } else {
                                loadLetterGame();
                            }
                        }, 1000);
                    } else {
                        btn.classList.add('wrong');
                        btn.disabled = true;
                    }
                };
                letterBtns.appendChild(btn);
            });
        }
    </script>
</body>
</html>
