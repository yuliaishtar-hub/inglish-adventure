<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Adventure</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="app">

  <!-- HOME -->
  <section id="home" class="screen active">

    <div class="home-art">
      <img src="https://yuliaishtar-hub.github.io/inglish-adventure/Lili.jpg"
           alt="Lily">
    </div>

    <div class="home-card">
      <div class="logo">🌈 English Adventure</div>

      <h1>Learn English.<br>Go on an adventure!</h1>

      <p class="subtitle">
        Meet Lily, learn new words and complete exciting quests.
      </p>

      <button id="startQuestBtn" class="main-button">
        🚀 Start Quest
      </button>

      <button id="gamesBtn" class="secondary-button">
        🎮 Games — Play & Learn
      </button>
    </div>

  </section>


  <!-- MAP -->
  <section id="map" class="screen">

    <header class="topbar">

      <button id="mapHomeBtn" class="small-button">
        🏠
      </button>

      <div class="player-info">
        <span id="playerName">Lily's Friend</span>
        <span>⭐ <b id="xpValue">0</b></span>
        <span>💎 <b id="gemsValue">0</b></span>
      </div>

    </header>

    <div class="map-content">

      <h1>🗺️ Adventure Map</h1>

      <p class="map-subtitle">
        Choose your adventure
      </p>

      <div class="zones">

        <button class="zone family-zone" data-lesson="family">
          <div class="zone-image">👨‍👩‍👧</div>
          <div>
            <strong>Family</strong>
            <span>Meet Lily's family</span>
          </div>
        </button>

        <button class="zone">
          <div class="zone-image">🏫</div>
          <div>
            <strong>School</strong>
            <span>Coming next</span>
          </div>
        </button>

        <button class="zone">
          <div class="zone-image">🐶</div>
          <div>
            <strong>Pet World</strong>
            <span>Coming next</span>
          </div>
        </button>

        <button class="zone">
          <div class="zone-image">🎨</div>
          <div>
            <strong>Colour Garden</strong>
            <span>Coming next</span>
          </div>
        </button>

        <button class="zone">
          <div class="zone-image">🍕</div>
          <div>
            <strong>Yummy Café</strong>
            <span>Coming next</span>
          </div>
        </button>

        <button class="zone">
          <div class="zone-image">☀️</div>
          <div>
            <strong>Weather Park</strong>
            <span>Coming next</span>
          </div>
        </button>

        <button class="zone">
          <div class="zone-image">🧸</div>
          <div>
            <strong>Toy Town</strong>
            <span>Coming next</span>
          </div>
        </button>

        <button class="zone">
          <div class="zone-image">🏠</div>
          <div>
            <strong>My Home</strong>
            <span>Coming next</span>
          </div>
        </button>

        <button class="zone shop-zone">
          <div class="zone-image">🎁</div>
          <div>
            <strong>Gift Shop</strong>
            <span>Spend your gems</span>
          </div>
        </button>

      </div>

    </div>

  </section>


  <!-- LESSON -->
  <section id="lesson" class="screen">

    <header class="lesson-topbar">

      <button id="lessonBackBtn" class="back-button">
        ← Back
      </button>

      <div class="lesson-progress">
        <span id="stageLabel">Family</span>
        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <div class="lesson-stats">
        ⭐ <span id="lessonXP">0</span>
        💎 <span id="lessonGems">0</span>
      </div>

    </header>

    <main id="lessonContent" class="lesson-content"></main>

  </section>


  <!-- REWARD -->
  <section id="reward" class="screen">

    <div class="reward-card">

      <div class="reward-icon">🎉</div>

      <h1 id="rewardTitle">
        Quest Complete!
      </h1>

      <p id="rewardText">
        You did it!
      </p>

      <div class="reward-numbers">
        <div>
          <span>⭐</span>
          <strong id="rewardXP">0</strong>
          <small>XP</small>
        </div>

        <div>
          <span>💎</span>
          <strong id="rewardGems">0</strong>
          <small>Gems</small>
        </div>
      </div>

      <button id="continueBtn" class="main-button">
        🗺️ Continue Adventure
      </button>

    </div>

  </section>


  <!-- MESSAGE -->
  <div id="toast" class="toast"></div>

</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
