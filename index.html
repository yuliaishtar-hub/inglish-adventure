<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Quest 🌈</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Verdana,sans-serif;
  background:linear-gradient(135deg,#cfeeff 0%,#f7d9ff 52%,#ffe1ee 100%);
  color:#30305c;
}

button{
  font:inherit;
}

#app{
  max-width:980px;
  margin:0 auto;
  padding:18px;
}

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.brand{
  font-size:30px;
  font-weight:900;
  color:#6339a6;
}

.stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.pill{
  background:#fff;
  border-radius:999px;
  padding:9px 15px;
  box-shadow:0 5px 16px #00000012;
  font-weight:800;
}

.card{
  background:#fff;
  border-radius:30px;
  padding:28px;
  box-shadow:0 16px 40px #54317b22;
}

/* =========================
   HOME
========================= */

.hero{
  min-height:560px;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:25px;
  align-items:center;
  overflow:hidden;
}

.hero-copy h1{
  font-size:58px;
  line-height:.98;
  margin:0 0 16px;
  color:#6339a6;
}

.hero-copy p{
  font-size:22px;
  line-height:1.45;
  margin:0 0 25px;
}

.hero-img{
  width:100%;
  height:460px;
  object-fit:contain;
  object-position:center;
  border-radius:28px;
  background:#f7f4ff;
  box-shadow:0 10px 25px #0002;
  padding:12px;
}

.primary,
.secondary,
.listen,
.mic,
.next{
  border:0;
  border-radius:18px;
  padding:15px 24px;
  font-weight:900;
  cursor:pointer;
  transition:.18s;
  box-shadow:0 7px 16px #00000018;
}

.primary{
  background:linear-gradient(135deg,#ff5f8d,#9b5cff);
  color:#fff;
  font-size:21px;
}

.secondary{
  background:#fff;
  color:#6339a6;
  border:2px solid #d8c6f7;
}

.listen{
  background:#eadbff;
  color:#6339a6;
}

.mic{
  background:#ff638d;
  color:#fff;
}

.next{
  background:#6b55d9;
  color:#fff;
}

.primary:hover,
.secondary:hover,
.listen:hover,
.mic:hover,
.next:hover{
  transform:translateY(-2px);
}

.small{
  font-size:14px;
  color:#777;
  margin-top:12px;
}

/* =========================
   GAMES BUTTON
========================= */

.home-games{
  margin-top:18px;
}

.games-main-btn{
  display:block;
  width:100%;
  padding:22px 24px;
  border:0;
  border-radius:24px;
  background:linear-gradient(135deg,#6b55d9,#ff5f8d);
  color:#fff;
  font-size:27px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 10px 24px #00000018;
  transition:.18s;
}

.games-main-btn:hover{
  transform:translateY(-3px);
  box-shadow:0 14px 30px #00000022;
}

/* =========================
   MAP
========================= */

.map-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.map-head h2{
  font-size:38px;
  margin:0;
}

.map-intro{
  font-size:18px;
  color:#666;
  margin:8px 0 20px;
}

.map-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.zone{
  border:0;
  border-radius:23px;
  background:#fff;
  padding:0;
  overflow:hidden;
  cursor:pointer;
  text-align:left;
  box-shadow:0 9px 22px #00000013;
  transition:.18s;
  position:relative;
}

.zone:hover{
  transform:translateY(-4px);
}

.zone.locked{
  cursor:not-allowed;
  filter:saturate(.55);
  opacity:.72;
}

.zone-img{
  width:100%;
  height:145px;
  object-fit:contain;
  object-position:center;
  background:#e9e3f5;
  padding:8px;
}

.zone-body{
  padding:14px;
}

.zone-num{
  font-size:13px;
  color:#7c65bd;
  font-weight:900;
}

.zone-title{
  font-size:20px;
  font-weight:900;
  margin-top:3px;
}

.zone-sub{
  font-size:14px;
  color:#777;
  margin-top:4px;
}

.lock{
  position:absolute;
  right:12px;
  top:12px;
  background:#fff;
  border-radius:50%;
  padding:8px;
  z-index:2;
}

/* =========================
   LESSON
========================= */

.lesson-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.lesson-title{
  font-size:30px;
  margin:0;
}

.progress{
  height:12px;
  background:#eee;
  border-radius:99px;
  overflow:hidden;
  margin:15px 0 22px;
}

.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#ff6b9d,#7c58dd);
  width:0;
}

.question{
  font-size:28px;
  font-weight:900;
  margin:10px 0 18px;
}

.big-image{
  width:min(100%,500px);
  height:285px;
  object-fit:contain;
  object-position:center;
  border-radius:24px;
  margin:auto;
  background:#f7f4ff;
  padding:10px;
  display:block;
}

.answer-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:20px;
}

.answer{
  border:2px solid #e2ddec;
  background:#fff;
  border-radius:18px;
  padding:15px;
  cursor:pointer;
  font-size:19px;
  font-weight:800;
  color:#45416d;
  transition:.15s;
}

.answer:hover{
  background:#f6f0ff;
  transform:translateY(-2px);
}

.answer.correct{
  background:#c9f5d0;
  border-color:#4caf68;
}

.answer.wrong{
  background:#ffd1d8;
  border-color:#f05c70;
}

.feedback{
  min-height:32px;
  font-size:18px;
  font-weight:900;
  margin:15px;
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

/* =========================
   STORY
========================= */

.story{
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:24px;
  align-items:center;
}

.story img{
  width:100%;
  height:390px;
  object-fit:contain;
  object-position:center;
  border-radius:25px;
  background:#f6f1ff;
  padding:10px;
}

.story-text{
  font-size:28px;
  font-weight:900;
  line-height:1.3;
}

.story-step{
  font-size:14px;
  color:#8b7ba7;
  font-weight:900;
  margin-bottom:12px;
}

/* =========================
   REWARD
========================= */

.reward{
  text-align:center;
  padding:30px;
}

.reward h2{
  font-size:42px;
  color:#6339a6;
  margin:8px;
}

.reward .stars{
  font-size:55px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

  #app{
    padding:10px;
  }

  .hero,
  .story{
    grid-template-columns:1fr;
  }

  .hero{
    min-height:auto;
  }

  .hero-copy h1{
    font-size:44px;
  }

  .hero-img{
    height:330px;
  }

  .map-grid{
    grid-template-columns:1fr 1fr;
  }

  .answer-grid{
    grid-template-columns:1fr;
  }

  .story img{
    height:300px;
  }
}

@media(max-width:480px){

  .map-grid{
    grid-template-columns:1fr;
  }

  .card{
    padding:18px;
    border-radius:22px;
  }

  .question{
    font-size:23px;
  }

  .hero-img{
    height:280px;
  }

  .games-main-btn{
    font-size:22px;
    padding:19px;
  }
}
</style>
</head>

        IMG+"mummy.jpg",
        [
          "She's my mummy.",
          "She's my sister.",
          "She's my grandma."
        ],
        0
      ),

      q(
        "Who is he?",
        IMG+"daddy.jpg",
        [
          "He's my brother.",
          "He's my daddy.",
          "He's my grandpa."
        ],
        1
      ),

      q(
        "What is it?",
        IMG+"Apple.jpg",
        [
          "It's an apple.",
          "It's a pizza.",
          "It's a burger."
        ],
        0
      ),

      q(
        "What is it?",
        IMG+"School bag.jpg",
        [
          "It's a school bag.",
          "It's a pen.",
          "It's a ruler."
        ],
        0
      )

    ]

  }

};


/* =========================================================
   PLAYER STATE
========================================================= */

const DEFAULT_STATE = {

  xp:0,
  gems:0,
  completed:[],
  unlocked:["family"]

};

let state;

try{

  const saved =
    localStorage.getItem("english_quest_v2");

  state =
    saved
    ? JSON.parse(saved)
    : null;

}catch(error){

  state=null;

}


if(
  !state ||
  typeof state !== "object"
){

  state={
    ...DEFAULT_STATE
  };

}


if(!Array.isArray(state.completed)){
  state.completed=[];
}

if(!Array.isArray(state.unlocked)){
  state.unlocked=["family"];
}

if(typeof state.xp !== "number"){
  state.xp=0;
}

if(typeof state.gems !== "number"){
  state.gems=0;
}


/* =========================================================
   CURRENT GAME
========================================================= */

let currentKey="";
let currentIndex=0;

let answered=false;

/*
  This variable controls the gem reward.
  One question = maximum one gem.
*/

let spokenRewarded=false;

let storyMode=false;


/* =========================================================
   SAVE
========================================================= */

function save(){

  try{

    localStorage.setItem(
      "english_quest_v2",
      JSON.stringify(state)
    );

  }catch(error){

    console.warn(
      "Could not save game progress.",
      error
    );

  }

  updateStats();

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats(){

  const xpElements=[
    document.getElementById("xp"),
    document.getElementById("lessonXp")
  ];

  xpElements.forEach(element=>{

    if(element){
      element.textContent=state.xp;
    }

  });


  const gemElements=[
    document.getElementById("gems"),
    document.getElementById("lessonGems")
  ];

  gemElements.forEach(element=>{

    if(element){
      element.textContent=state.gems;
    }

  });

}


/* =========================================================
   SHOW SCREEN
========================================================= */

function show(id){

  document
    .querySelectorAll(".screen")
    .forEach(screen=>{
      screen.classList.remove("active");
    });


  const target=
    document.getElementById(id);


  if(target){

    target.classList.add("active");

  }


  window.scrollTo(0,0);

}


/* =========================================================
   HOME
========================================================= */

function goHome(){

  show("home");

}


/* =========================================================
   MAP
========================================================= */

function showMap(){

  renderMap();

  updateStats();

  show("map");

}


function renderMap(){

  const grid=
    document.getElementById("mapGrid");


  if(!grid)return;


  grid.innerHTML="";


  zones.forEach((zone,index)=>{

    const unlocked=
      state.unlocked.includes(zone.key);

    const done=
      state.completed.includes(zone.key);


    const button=
      document.createElement("button");


    button.type="button";

    button.className=
      "zone"+
      (
        unlocked
        ? ""
        : " locked"
      );


    const imageHTML=

      zone.image

      ?

      `
        <img
          class="zone-img"
          src="${zone.image}"
          alt=""
        >
      `

      :

      `
        <div
          class="zone-img"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:70px;
          "
        >
          ${zone.icon}
        </div>
      `;


    button.innerHTML=

      `
        ${
          !unlocked
          ? '<div class="lock">🔒</div>'
          : ''
        }

        ${imageHTML}

        <div class="zone-body">

          <div class="zone-num">
            ZONE ${index+1}
            ${done ? "✓" : ""}
          </div>

          <div class="zone-title">
            ${zone.icon} ${zone.title}
          </div>

          <div class="zone-sub">
            ${zone.sub}
          </div>

        </div>
      `;


    if(unlocked){

      button.addEventListener(
        "click",
        ()=>{
          startLevel(zone.key);
        }
      );

    }


    grid.appendChild(button);

  });

}


/* =========================================================
   START LEVEL
========================================================= */

function startLevel(key){

  if(!levels[key]){
    return;
  }


  currentKey=key;

  currentIndex=0;

  answered=false;

  spokenRewarded=false;

  storyMode=
    levels[key].type==="story";


  const title=
    document.getElementById("lessonTitle");


  if(title){

    title.textContent=
      levels[key].name;

  }


  show("lesson");

  renderLesson();

}


/* =========================================================
   RENDER LESSON
========================================================= */

function renderLesson(){

  const data=
    levels[currentKey];


  if(!data){
    showMap();
    return;
  }


  const total=
    storyMode
    ? data.scenes.length
    : data.questions.length;


  const counter=
    document.getElementById("counter");


  if(counter){

    counter.textContent=
      `${currentIndex+1} / ${total}`;

  }


  const progress=
    document.getElementById("progressFill");


  if(progress){

    progress.style.width=
      ((currentIndex+1)/total*100)+"%";

  }


  const box=
    document.getElementById("lessonContent");


  if(!box)return;


  if(storyMode){

    renderStory(
      box,
      data.scenes[currentIndex]
    );

    return;

  }


  const item=
    data.questions[currentIndex];


  answered=false;

  spokenRewarded=false;


  const image=

    typeof item.image==="string" &&
    item.image.startsWith("http")

    ?

    `
      <img
        class="big-image"
        src="${item.image}"
        alt=""
      >
    `

    :

    `
      <div
        class="big-image"
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:100px;
        "
      >
        ${item.image}
      </div>
    `;


  box.innerHTML=

    `
      ${image}

      <div class="question">
        ${item.question}
      </div>

      <button
        id="listenQuestion"
        class="listen"
        type="button"
      >
        🔊 Listen to question
      </button>

      <div
        id="answers"
        class="answer-grid"
      ></div>

      <div
        id="feedback"
        class="feedback"
      ></div>

      <div class="actions">

        <button
          id="mic"
          class="mic"
          type="button"
          style="display:none"
        >
          🎤 Say it!
        </button>

        <button
          id="next"
          class="next"
          type="button"
          style="display:none"
        >
          Next ➡️
        </button>

      </div>
    `;


  const listenButton=
    document.getElementById("listenQuestion");


  if(listenButton){

    listenButton.addEventListener(
      "click",
      ()=>{
        speak(item.question);
      }
    );

  }


  const mic=
    document.getElementById("mic");


  if(mic){

    mic.addEventListener(
      "click",
      listenAnswer
    );

  }


  const next=
    document.getElementById("next");


  if(next){

    next.addEventListener(
      "click",
      nextItem
    );

  }


  const answers=
    document.getElementById("answers");


  item.options.forEach(
    (text,index)=>{

      const button=
        document.createElement("button");


      button.type="button";

      button.className="answer";

      button.textContent=text;


      button.addEventListener(
        "click",
        ()=>{
          selectAnswer(
            index,
            button
          );
        }
      );


      answers.appendChild(button);

    }
  );

}


/* =========================================================
   STORY
========================================================= */

function renderStory(box,scene){

  box.innerHTML=

    `
      <div class="story">

        <img
          src="${scene.image}"
          alt="Lily story"
        >

        <div>

          <div class="story-step">
            LILY'S STORY • SCENE ${currentIndex+1}
          </div>

          <div class="story-text">
            ${scene.text}
          </div>

          <div
            class="actions"
            style="margin-top:24px"
          >

            <button
              id="storyListen"
              class="listen"
              type="button"
            >
              🔊 Listen
            </button>

            <button
              id="storyNext"
              class="next"
              type="button"
            >
              ${
                currentIndex ===
                levels[currentKey].scenes.length-1
                ? "Finish story"
                : "Next ➡️"
              }
            </button>

          </div>

        </div>

      </div>
    `;


  const listen=
    document.getElementById("storyListen");


  if(listen){

    listen.addEventListener(
      "click",
      ()=>{
        speak(scene.text,true);
      }
    );

  }


  const next=
    document.getElementById("storyNext");


  if(next){

    next.addEventListener(
      "click",
      nextItem
    );

  }

}


/* =========================================================
   CHECK ANSWER
========================================================= */

function selectAnswer(index,button){

  if(answered){
    return;
  }


  const item=
    levels[currentKey]
      .questions[currentIndex];


  if(index===item.correctIndex){

    answered=true;


    button.classList.add("correct");


    document
      .querySelectorAll(".answer")
      .forEach(answerButton=>{
        answerButton.disabled=true;
      });


    /*
      Correct answer:
      +10 XP
      NO GEM YET
    */

    state.xp += 10;

    save();


    const feedback=
      document.getElementById("feedback");


    if(feedback){

      feedback.textContent=
        "Great! Now say it aloud! +10 XP ⭐";

      feedback.style.color=
        "#39964e";

    }


    const mic=
      document.getElementById("mic");


    if(mic){

      mic.style.display=
        "inline-block";

    }


    const next=
      document.getElementById("next");


    if(next){

      next.style.display=
        "inline-block";

    }


    speak(
      item.options[item.correctIndex],
      true
    );


  }else{

    button.classList.add("wrong");

    button.disabled=true;


    const feedback=
      document.getElementById("feedback");


    if(feedback){

      feedback.textContent=
        "Oops! Try again!";

      feedback.style.color=
        "#e2536c";

    }


    speak(
      item.options[item.correctIndex],
      true
    );

  }

}


/* =========================================================
   NEXT ITEM
========================================================= */

function nextItem(){

  const total=

    storyMode

    ? levels[currentKey].scenes.length

    : levels[currentKey].questions.length;


  currentIndex++;


  if(currentIndex>=total){

    finishLevel();

    return;

  }


  renderLesson();

}


/* =========================================================
   FINISH LEVEL
========================================================= */

function finishLevel(){

  if(
    !state.completed.includes(currentKey)
  ){

    state.completed.push(currentKey);

  }


  const position=
    zones.findIndex(
      zone=>zone.key===currentKey
    );


  const nextZone=
    zones[position+1];


  if(
    nextZone &&
    !state.unlocked.includes(nextZone.key)
  ){

    state.unlocked.push(
      nextZone.key
    );

  }


  save();


  const title=
    document.getElementById("rewardTitle");


  if(title){

    title.textContent=
      levels[currentKey].name+
      " complete!";

  }


  const text=
    document.getElementById("rewardText");


  if(text){

    text.textContent=
      "Amazing job! You completed this adventure! 🌟";

  }


  show("reward");


  speak(
    "Well done! Great job!",
    true
  );

}


/* =========================================================
   VOICE
========================================================= */

function speak(text,slow=false){

  if(
    !("speechSynthesis" in window)
  ){

    return;

  }


  speechSynthesis.cancel();


  const utterance=
    new SpeechSynthesisUtterance(text);


  utterance.lang="en-US";

  utterance.rate=
    slow
    ? 0.72
    : 0.82;

  utterance.pitch=1.08;

  utterance.volume=1;


  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   NORMALIZE SPEECH
========================================================= */

function normalizeSpeech(text){

  return String(text || "")
    .toLowerCase()
    .replace(/[.,!?;:'"’`]/g,"")
    .replace(/\s+/g," ")
    .trim();

}


/* =========================================================
   MICROPHONE
========================================================= */

function listenAnswer(){

  /*
    If this question has already received a gem,
    do not allow another reward.
  */

  if(spokenRewarded){

    const feedback=
      document.getElementById("feedback");

    if(feedback){

      feedback.textContent=
        "You already earned the 💎 for this question!";

    }

    return;

  }


  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    alert(
      "Speech recognition is not available in this browser. You can still use Listen and choose the answer."
    );

    return;

  }


  const item=
    levels[currentKey]
      .questions[currentIndex];


  const mic=
    document.getElementById("mic");


  if(mic){

    mic.textContent=
      "🎤 Listening...";

    mic.disabled=true;

  }


  const recognition=
    new SpeechRecognition();


  recognition.lang="en-US";

  recognition.interimResults=false;

  recognition.maxAlternatives=3;


  recognition.onresult=function(event){

    const heard=
      normalizeSpeech(
        event.results[0][0].transcript
      );


    const correct=
      normalizeSpeech(
        item.options[item.correctIndex]
      );


    const words=
      correct
        .split(/\s+/)
        .filter(
          word=>word.length>2
        );


    const hits=
      words.filter(
        word=>heard.includes(word)
      ).length;


    const goodSpeech=

      heard===correct ||

      heard.includes(correct) ||

      (
        words.length>0 &&
        hits>=Math.max(
          1,
          Math.ceil(words.length*0.65)
        )
      );


    if(mic){

      mic.textContent=
        "🎤 Say it!";

      mic.disabled=false;

    }


    if(goodSpeech){

      /*
        SUCCESS:
        +1 GEM ONCE ONLY
      */

      if(!spokenRewarded){

        spokenRewarded=true;

        state.gems += 1;

        save();

      }


      const feedback=
        document.getElementById("feedback");


      if(feedback){

        feedback.textContent=
          "Excellent speaking! 🎉 +1 💎";

        feedback.style.color=
          "#39964e";

      }


    }else{

      /*
        Wrong pronunciation:
        NO GEM
      */

      const feedback=
        document.getElementById("feedback");


      if(feedback){

        feedback.textContent=
          "Good try! Listen once more and repeat.";

        feedback.style.color=
          "#8a5a9e";

      }


      speak(
        item.options[item.correctIndex],
        true
      );

    }

  };


  recognition.onerror=function(){

    if(mic){

      mic.textContent=
        "🎤 Say it!";

      mic.disabled=false;

    }


    const feedback=
      document.getElementById("feedback");


    if(feedback){

      feedback.textContent=
        "I couldn't hear that. Please try again.";

      feedback.style.color=
        "#8a5a9e";

    }

  };


  recognition.onend=function(){

    if(mic){

      mic.textContent=
        "🎤 Say it!";

      mic.disabled=false;

    }

  };


  try{

    recognition.start();

  }catch(error){

    if(mic){

      mic.textContent=
        "🎤 Say it!";

      mic.disabled=false;

    }

  }

}


/* =========================================================
   BUTTONS
========================================================= */

const startQuestBtn=
  document.getElementById("startQuestBtn");


if(startQuestBtn){

  startQuestBtn.addEventListener(
    "click",
    showMap
  );

}


const gamesBtn=
  document.getElementById("gamesBtn");


if(gamesBtn){

  gamesBtn.addEventListener(
    "click",
    function(){

      window.location.href=
        "games.html";

    }
  );

}


const homeBtn=
  document.getElementById("homeBtn");


if(homeBtn){

  homeBtn.addEventListener(
    "click",
    goHome
  );

}


const mapBtn=
  document.getElementById("mapBtn");


if(mapBtn){

  mapBtn.addEventListener(
    "click",
    showMap
  );

}


const continueBtn=
  document.getElementById("continueBtn");


if(continueBtn){

  continueBtn.addEventListener(
    "click",
    showMap
  );

}


/* =========================================================
   INITIALIZE
========================================================= */

updateStats();

</script>
