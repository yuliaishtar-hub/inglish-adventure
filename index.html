<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Adventure</title>
    <style>
        body { font-family: 'Comic Sans MS', 'Comic Sans', cursive; background-color: #87CEEB; text-align: center; padding: 20px; }
        
        #game-container { background-color: #fff; border-radius: 20px; padding: 20px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); position: relative; }
        
        h1 { color: #4CAF50; }
        
        /* Кнопки меню */
        .top-btn { position: absolute; top: 20px; padding: 10px 15px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; font-size: 16px; }
        #menu-btn { left: 20px; background-color: #f0f0f0; }
        #shop-btn { right: 20px; background-color: #FFC107; }
        
        /* Экран Гардероба */
        #wardrobe-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(255,255,255,0.95); border-radius: 20px; z-index: 10; padding: 20px; box-sizing: border-box; }
        #wardrobe-screen h2 { margin-top: 40px; }
        .hat-option { font-size: 40px; margin: 10px; cursor: pointer; border: 2px solid #ccc; border-radius: 10px; display: inline-block; padding: 5px 15px; }
        .hat-option:hover { border-color: #4CAF50; background-color: #e8f5e9; }
        .hat-option.active { border-color: #4CAF50; background-color: #c8e6c9; }
        #close-wardrobe { margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer; background-color: #f44336; color: white; border: none; border-radius: 5px; }

        /* Лили */
        #lily-wrap { font-size: 80px; line-height: 1.2; margin: 20px 0; }
        #lily-hat { font-size: 50px; display: block; margin-bottom: -20px; } /* Шляпа над Лили */
        
        /* Игровые элементы */
        #xp-bar { background-color: #ddd; border-radius: 10px; height: 20px; width: 100%; margin-bottom: 20px; }
        #xp-fill { background-color: #4caf50; height: 100%; width: 0; border-radius: 10px; }
        #crystal-count { font-size: 20px; margin-bottom: 10px; }
        
        #question-text { font-size: 24px; color: #333; margin-bottom: 20px; }
        .answer-btn { display: block; width: 80%; margin: 10px auto; padding: 15px; font-size: 20px; background-color: #eee; border: 2px solid #ccc; border-radius: 10px; cursor: pointer; }
        .answer-btn.correct { background-color: #a5d6a7; border-color: #4caf50; }
        .answer-btn.wrong { background-color: #ef9a9a; border-color: #f44336; }
        
        #feedback { font-size: 18px; font-weight: bold; margin: 15px 0; min-height: 25px; }
        #mic-btn { padding: 15px 30px; font-size: 20px; background-color: #FFC107; border: none; border-radius: 10px; cursor: pointer; display: none; }
        #mic-btn.active { background-color: #ff9800; }
        #next-btn { padding: 15px 30px; font-size: 20px; background-color: #2196F3; border: none; border-radius: 10px; cursor: pointer; display: none; color: white; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Основное игровое поле -->
        <div id="main-screen">
            <button id="menu-btn" class="top-btn" onclick="goHome()">🏠 Menu</button>
            <button id="shop-btn" class="top-btn" onclick="openWardrobe()">🎩 Shop</button>
            
            <h1>Pet World</h1>
            
            <div id="lily-wrap">
                <div id="lily-hat">🎩</div> <!-- Здесь будет шляпа -->
                <div id="lily-emoji">👧🏻</div>
            </div>
            
            <div id="xp-bar"><div id="xp-fill"></div></div>
            <div id="crystal-count">💎 <span id="crystals">0</span></div>
            
            <div id="question-text">Loading...</div>
            <div id="answers"></div>
            <div id="feedback"></div>
            
            <button id="mic-btn" onclick="startListening()">🎤 Say it!</button>
            <button id="next-btn" onclick="nextQuestion()">Next ➡️</button>
        </div>

        <!-- Экран Гардероба (Магазин) -->
        <div id="wardrobe-screen">
            <h2>Lily's Wardrobe</h2>
            <p>Choose a hat!</p>
            
            <div class="hat-option" onclick="selectHat('🎩')">🎩</div>
            <div class="hat-option" onclick="selectHat('🎓')">🎓</div>
            <div class="hat-option" onclick="selectHat('👑')">👑</div>
            <div class="hat-option" onclick="selectHat('🧢')">🧢</div>
            <div class="hat-option" onclick="selectHat('⚽')">⚽</div>
            
            <br><br>
            <button id="close-wardrobe" onclick="closeWardrobe()">Close</button>
        </div>
    </div>

    <script>
        // ---------- GAME DATA ----------
        let xp = 0;
        let crystals = 0;
        let currentQuestionIndex = 0;
        let currentQuestion = {};
        let correctAnswerText = "";
        let currentHat = "🎩"; // Шляпа по умолчанию

        // School vocabulary based on textbook
        const petWorldQuestions = [
            { question: "What is it?", image: "🐒", options: ["It's a chimp.", "It's a fish.", "It's a bird."], correctIndex: 0 },
            { question: "What is it?", image: "🐟", options: ["It's a mouse.", "It's a frog.", "It's a fish."], correctIndex: 2 },
            { question: "What is it?", image: "🐦", options: ["It's a bird.", "It's a chimp.", "It's a mouse."], correctIndex: 0 },
            { question: "What is it?", image: "🐭", options: ["It's a fish.", "It's a mouse.", "It's a frog."], correctIndex: 1 },
            { question: "What is it?", image: "🐸", options: ["It's a frog.", "It's a bird.", "It's a chimp."], correctIndex: 0 }
        ];

        const allQuestions = petWorldQuestions; // Currently only Pet World

        // ---------- INITIALIZATION ----------
        window.onload = function() {
            loadProgress();
            updateHatUI();
            loadQuestion();
        };

        function loadProgress() {
            if (localStorage.getItem('xp')) xp = parseInt(localStorage.getItem('xp'));
            if (localStorage.getItem('crystals')) crystals = parseInt(localStorage.getItem('crystals'));
            if (localStorage.getItem('currentHat')) currentHat = localStorage.getItem('currentHat');
            
            updateUI();
        }

        function saveProgress() {
            localStorage.setItem('xp', xp);
            localStorage.setItem('crystals', crystals);
            localStorage.setItem('currentHat', currentHat);
        }

        function updateUI() {
            document.getElementById('xp-fill').style.width = (xp % 100) + '%';
            document.getElementById('crystals').innerText = crystals;
        }

        // ---------- WARDROBE LOGIC ----------
        function openWardrobe() {
            document.getElementById('wardrobe-screen').style.display = 'block';
            updateHatUI();
        }

        function closeWardrobe() {
            document.getElementById('wardrobe-screen').style.display = 'none';
        }

        function selectHat(hatEmoji) {
            currentHat = hatEmoji;
            saveProgress();
            updateHatUI();
        }

        function updateHatUI() {
            document.getElementById('lily-hat').innerText = currentHat;
            
            // Подсветим выбранную шляпу в магазине
            const hats = document.querySelectorAll('.hat-option');
            hats.forEach(hat => {
                if (hat.innerText === currentHat) hat.classList.add('active');
                else hat.classList.remove('active');
            });
        }

        // ---------- QUESTION LOGIC ----------
        function loadQuestion() {
            if (currentQuestionIndex >= allQuestions.length) currentQuestionIndex = 0;
            
            currentQuestion = allQuestions[currentQuestionIndex];
            correctAnswerText = currentQuestion.options[currentQuestion.correctIndex];

            document.getElementById('question-text').innerHTML = currentQuestion.image + "<br>" + currentQuestion.question;
            document.getElementById('feedback').innerText = "";
            document.getElementById('mic-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = "";

            currentQuestion.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.className = 'answer-btn';
                btn.onclick = () => selectAnswer(index, btn);
                answersDiv.appendChild(btn);
            });
        }

        function selectAnswer(index, btn) {
            const buttons = document.querySelectorAll('.answer-btn');
            
            if (index === currentQuestion.correctIndex) {
                buttons.forEach(b => b.disabled = true);
                btn.classList.add('correct');
                document.getElementById('feedback').innerHTML = "Great! Now say it aloud!";
                document.getElementById('feedback').style.color = '#4CAF50';
                
                document.getElementById('mic-btn').style.display = 'inline-block';
                speakText(correctAnswerText, true);
            } else {
                btn.classList.add('wrong');
                btn.disabled = true;
                document.getElementById('feedback').innerHTML = "Oops! Try again!";
                document.getElementById('feedback').style.color = '#f44336';
            }
        }

        // ---------- VOICE LOGIC ----------
        function speakText(text, slow = false) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = slow ? 0.7 : 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function startListening() {
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('active');
            micBtn.innerText = "Listening...";

            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.start();

            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript.toLowerCase();
                const cleanSpoken = spokenText.trim().replace(/[.,!?;:]/g, '');
                const cleanCorrect = correctAnswerText.toLowerCase().replace(/[.,!?;:]/g, '');

                if (cleanSpoken.includes(cleanCorrect) || cleanCorrect.includes(cleanSpoken)) {
                    xp += 10;
                    crystals += 1;
                    saveProgress();
                    updateUI();
                    
                    micBtn.classList.remove('active');
                    micBtn.style.display = 'none';
                    document.getElementById('feedback').innerHTML = "Excellent! +10 XP!";
                    document.getElementById('feedback').style.color = '#4CAF50';
                    document.getElementById('next-btn').style.display = 'inline-block';
                } else {
                    micBtn.classList.remove('active');
                    micBtn.innerText = "🎤 Try Again";
                    document.getElementById('feedback').innerHTML = "Not quite. Listen to Lily and try again!";
                    document.getElementById('feedback').style.color = '#f44336';
                    speakText(correctAnswerText, true);
                }
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('active');
                micBtn.innerText = "🎤 Say it!";
                alert("Microphone error: " + event.error + ". Please try again.");
            };

            recognition.onend = () => {
                if(micBtn.classList.contains('active')){
                    micBtn.classList.remove('active');
                    micBtn.innerText = "🎤 Say it!";
                }
            };
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        // Просто заглушка, чтобы кнопка Menu не ломала игру, пока мы не сделали полноценный выбор локаций
        function goHome() {
            alert("We are in Pet World! Other locations coming soon.");
        }
    </script>
</body>
</html>
