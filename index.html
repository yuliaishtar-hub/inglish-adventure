<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Quest 🌈</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Verdana,sans-serif;
  background:linear-gradient(135deg,#cfeeff 0%,#f7d9ff 52%,#ffe1ee 100%);
  color:#30305c;
}

button{font:inherit}

#app{
  max-width:980px;
  margin:0 auto;
  padding:18px;
}

.screen{display:none}
.screen.active{display:block}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
}

.brand{
  font-size:30px;
  font-weight:900;
  color:#6339a6;
}

.stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.pill{
  background:#fff;
  border-radius:999px;
  padding:9px 15px;
  box-shadow:0 5px 16px #00000012;
  font-weight:800;
}

.card{
  background:#fff;
  border-radius:30px;
  padding:28px;
  box-shadow:0 16px 40px #54317b22;
}

/* HOME */

.hero{
  min-height:560px;
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:25px;
  align-items:center;
  overflow:hidden;
}

.hero-copy h1{
  font-size:58px;
  line-height:.98;
  margin:0 0 16px;
  color:#6339a6;
}

.hero-copy p{
  font-size:22px;
  line-height:1.45;
  margin:0 0 25px;
}

.hero-img{
  width:100%;
  height:460px;
  object-fit:contain;
  object-position:center;
  border-radius:28px;
  background:#f7f4ff;
  box-shadow:0 10px 25px #0002;
  padding:12px;
}

.primary,
.secondary,
.listen,
.mic,
.next{
  border:0;
  border-radius:18px;
  padding:15px 24px;
  font-weight:900;
  cursor:pointer;
  transition:.18s;
  box-shadow:0 7px 16px #00000018;
}

.primary{
  background:linear-gradient(135deg,#ff5f8d,#9b5cff);
  color:#fff;
  font-size:21px;
}

.secondary{
  background:#fff;
  color:#6339a6;
  border:2px solid #d8c6f7;
}

.listen{
  background:#eadbff;
  color:#6339a6;
}

.mic{
  background:#ff638d;
  color:#fff;
}
