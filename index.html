<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Adventure</title>
    <style>
        body { font-family: 'Comic Sans MS', 'Comic Sans', cursive; background-color: #87CEEB; text-align: center; padding: 20px; }
        #game-container { background-color: #fff; border-radius: 20px; padding: 20px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        
        /* Presentation Screen */
        #presentation-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 400px; }
        #lily-avatar { font-size: 80px; animation: lilyWave 2s infinite; }
        #presentation-title { font-size: 36px; color: #4CAF50; margin: 20px 0; }
        #presentation-text { font-size: 22px; color: #333; margin-bottom: 30px; }
        #start-btn { padding: 20px 40px; font-size: 24px; background-color: #4CAF50; color: white; border: none; border-radius: 20px; cursor: pointer; transition: all 0.3s; animation: pulse 2s infinite; }
        #start-btn:hover { transform: scale(1.1); }
        
        /* Main Menu Screen */
        #menu-screen { display: none; }
        #menu-title { font-size: 32px; color: #4CAF50; margin-bottom: 30px; }
        #shop-btn-menu { padding: 15px 30px; background-color: #FFC107; border: none; border-radius: 15px; cursor: pointer; font-size: 18px; margin-bottom: 20px; }
        #topics-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin: 20px 0; }
        .topic-card { background-color: #f0f8ff; border-radius: 15px; padding: 20px; cursor: pointer; transition: all 0.3s; border: 3px solid #ccc; }
        .topic-card:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .topic-card.locked { opacity: 0.6; cursor: not-allowed; }
        .topic-card img { font-size: 40px; margin-bottom: 10px; }
        .topic-card .topic-name { font-size: 18px; font-weight: bold; }
        .topic-card .topic-xp { font-size: 14px; color: #666; }
        .topic-card .lock-icon { font-size: 24px; position: absolute; top: 10px; right: 10px; }
        #back-to-presentation { padding: 15px 30px; background-color: #2196F3; color: white; border: none; border-radius: 15px; cursor: pointer; font-size: 18px; margin-top: 20px; }
        
        /* Game Screen */
        #game-screen { display: none; }
        #back-to-menu-btn { position: absolute; top: 20px; left: 20px; padding: 10px 20px; background-color: #4CAF50; border: none; border-radius: 15px; cursor: pointer; font-size: 16px; z-index: 10; color: white; }
        #shop-btn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; background-color: #FFC107; border: none; border-radius: 15px; cursor: pointer; font-size: 16px; z-index: 10; }
        #shop-btn:hover { transform: scale(1.05); }
        #lily-img { font-size: 60px; display: inline-block; transition: transform 0.3s; position: relative; margin-top: 40px; }
        #lily-img .accessory { font-size: 30px; position: absolute; }
        #lily-img.jumping { animation: jump 0.8s ease-in-out; }
        #lily-img.shaking { animation: shake 0.5s ease-in-out; }
        #question-text { font-size: 24px; color: #333; margin-bottom: 20px; animation: fadeIn 0.5s; }
        .answer-btn { display: block; width: 80%; margin: 15px auto; padding: 15px; font-size: 20px; background-color: #f0f8ff; border: 3px solid #ccc; border-radius: 15px; cursor: pointer; transition: all 0.3s; animation: slideIn 0.5s ease-out; }
        .answer-btn:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .answer-btn.correct { background-color: #a5d6a7; border-color: #4caf50; animation: correctPulse 0.5s; }
        .answer-btn.wrong { background-color: #ef9a9a; border-color: #f44336; animation: wrongShake 0.5s; }
        #feedback { font-size: 18px; font-weight: bold; margin: 15px 0; animation: fadeIn 0.5s; }
        #mic-btn { padding: 15px 30px; font-size: 20px; background-color: #FFC107; border: none; border-radius: 15px; cursor: pointer; display: none; transition: all 0.3s; }
        #mic-btn:hover { transform: scale(1.1); box-shadow: 0 4px 15px rgba(255,193,7,0.5); }
        #mic-btn.active { background-color: #ff9800; animation: pulse 1s infinite; }
        #next-btn { padding: 15px 30px; font-size: 20px; background-color: #2196F3; border: none; border-radius: 15px; cursor: pointer; display: none; color: white; transition: all 0.3s; }
        #next-btn:hover { transform: scale(1.1); box-shadow: 0 4px 15px rgba(33,150,243,0.5); }
        #xp-bar { background-color: #ddd; border-radius: 10px; height: 25px; width: 100%; margin-bottom: 20px; overflow: hidden; }
        #xp-fill { background: linear-gradient(90deg, #4caf50, #8bc34a); height: 100%; width: 0; border-radius: 10px; transition: width 0.5s ease; }
        #crystal-count { font-size: 20px; animation: crystalSpin 0.5s; }
        
        /* Shop Screen */
        #shop-screen { display: none; }
        #shop-items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .shop-item { background-color: #f0f8ff; border-radius: 15px; padding: 15px; cursor: pointer; transition: all 0.3s; }
        .shop-item:hover { transform: scale(1.05); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .shop-item.bought { opacity: 0.5; cursor: default; }
        .shop-item img { font-size: 40px; margin-bottom: 10px; }
        .shop-item .price { color: #FFC107; font-weight: bold; }
        #back-btn { padding: 15px 30px; background-color: #2196F3; color: white; border: none; border-radius: 15px; cursor: pointer; font-size: 18px; }
        
        /* Animations */
        @keyframes lilyWave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(20deg); } 75% { transform: rotate(-20deg); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-30px) scale(1.2); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px) rotate(-10deg); } 75% { transform: translateX(10px) rotate(10deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes correctPulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes wrongShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        @keyframes crystalSpin { from { transform: rotate(0deg) scale(1); } to { transform: rotate(360deg) scale(1.3); } }
        @keyframes fall { to { transform: translateY(500px) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Presentation Screen -->
        <div id="presentation-screen">
            <div id="lily-avatar">👧🏻</div>
            <h1 id="presentation-title">English Adventure</h1>
            <p id="presentation-text">Hi! I'm Lily! Let's play and learn English together!</p>
            <button id="start-btn" onclick="startGame()">🚀 Start!</button>
        </div>

        <!-- Main Menu Screen -->
        <div id="menu-screen">
            <h1 id="menu-title">🌍 Choose Your Adventure!</h1>
            <button id="shop-btn-menu" onclick="openShop()">🛍️ Shop</button>
            <div id="topics-list"></div>
            <button id="back-to-presentation" onclick="backToPresentation()">⬅️ Back</button>
        </div>

        <!-- Main Game Screen -->
        <div id="game-screen">
            <button id="back-to-menu-btn" onclick="backToMenu()">🏠 Menu</button>
            <button id="shop-btn" onclick="openShop()">🛍️ Shop</button>
            <h1 id="game-title">English Adventure</h1>
            <div id="lily-img">👧🏻<span id="lily-accessories"></span></div>
            <div id="xp-bar"><div id="xp-fill"></div></div>
            <div id="crystal-count">💎 0</div>
            <div id="question-text">Loading...</div>
            <div id="answers"></div>
            <div id="feedback"></div>
            <button id="mic-btn" onclick="startListening()">🎤 Say it!</button>
            <button id="next-btn" onclick="nextQuestion()">Next ➡️</button>
        </div>

        <!-- Shop Screen -->
        <div id="shop-screen">
            <h2>Lily's Shop</h2>
            <p id="shop-crystals">💎 0</p>
            <div id="shop-items"></div>
            <button id="back-btn" onclick="closeShop()">⬅️ Back</button>
        </div>
    </div>

    <script>
        // ---------- GAME DATA ----------
        let xp = 0;
        let crystals = 0;
        let currentQuestionIndex = 0;
        let currentQuestion = {};
        let correctAnswerText = "";
        let currentTopic = null;
        
        // Items for Lily
        let purchasedItems = [];
        
        const shopItems = [
            { id: 'hat', name: 'Hat', emoji: '🎩', price: 5 },
            { id: 'crown', name: 'Crown', emoji: '👑', price: 10 },
            { id: 'bow', name: 'Bow', emoji: '🎀', price: 7 },
            { id: 'wings', name: 'Wings', emoji: '🦋', price: 15 },
            { id: 'cat', name: 'Cat', emoji: '🐱', price: 20 },
            { id: 'dog', name: 'Dog', emoji: '🐶', price: 20 }
        ];

        // Topics / Locations
        const topics = [
            { id: 'pet-world', name: 'Pet World', emoji: '🐾', xpRequired: 0, questions: [
                { question: "What is it?", image: "🐒", options: ["It's a chimp.", "It's a fish.", "It's a bird."], correctIndex: 0 },
                { question: "What is it?", image: "🐟", options: ["It's a mouse.", "It's a frog.", "It's a fish."], correctIndex: 2 },
                { question: "What is it?", image: "🐦", options: ["It's a bird.", "It's a chimp.", "It's a mouse."], correctIndex: 0 },
                { question: "What is it?", image: "🐭", options: ["It's a fish.", "It's a mouse.", "It's a frog."], correctIndex: 1 },
                { question: "What is it?", image: "🐸", options: ["It's a frog.", "It's a bird.", "It's a chimp."], correctIndex: 0 }
            ]},
            { id: 'colour-castle', name: 'Colour Castle', emoji: '🎨', xpRequired: 50, questions: [
                { question: "What colour is it?", image: "🔴", options: ["It's red.", "It's blue.", "It's green."], correctIndex: 0 },
                { question: "What colour is it?", image: "🟡", options: ["It's brown.", "It's yellow.", "It's black."], correctIndex: 1 },
                { question: "What colour is it?", image: "🔵", options: ["It's white.", "It's orange.", "It's blue."], correctIndex: 2 },
                { question: "What colour is it?", image: "⚪", options: ["It's white.", "It's red.", "It's yellow."], correctIndex: 0 },
                { question: "What colour is it?", image: "🟠", options: ["It's black.", "It's orange.", "It's blue."], correctIndex: 1 }
            ]},
            { id: 'family-house', name: 'Family House', emoji: '👨‍👩‍👧', xpRequired: 100, questions: [
                { question: "Who is she?", image: "👩", options: ["She's my mummy.", "She's my sister.", "She's my grandma."], correctIndex: 0 },
                { question: "Who is he?", image: "👨", options: ["He's my brother.", "He's my daddy.", "He's my grandpa."], correctIndex: 1 },
                { question: "Who is she?", image: "👧", options: ["She's my sister.", "She's my mummy.", "She's my grandma."], correctIndex: 0 },
                { question: "Who is he?", image: "👴", options: ["He's my daddy.", "He's my brother.", "He's my grandpa."], correctIndex: 2 },
                { question: "Who is she?", image: "👵", options: ["She's my grandma.", "She's my sister.", "She's my mummy."], correctIndex: 0 }
            ]},
            { id: 'school', name: 'School', emoji: '🏫', xpRequired: 150, questions: [
                { question: "What is it?", image: "📚", options: ["It's a book.", "It's a pencil.", "It's a bag."], correctIndex: 0 },
                { question: "What is it?", image: "✏️", options: ["It's a ruler.", "It's a book.", "It's a pencil."], correctIndex: 2 },
                { question: "What is it?", image: "🎒", options: ["It's a bag.", "It's a book.", "It's a pencil."], correctIndex: 0 },
                { question: "What is it?", image: "📏", options: ["It's a pencil.", "It's a ruler.", "It's a book."], correctIndex: 1 },
                { question: "What is it?", image: "✂️", options: ["It's scissors.", "It's a book.", "It's a bag."], correctIndex: 0 }
            ]},
            { id: 'yummy-cafe', name: 'Yummy Café', emoji: '🍕', xpRequired: 200, questions: [
                { question: "What is it?", image: "🍕", options: ["It's pizza.", "It's a burger.", "It's ice cream."], correctIndex: 0 },
                { question: "What is it?", image: "🍔", options: ["It's a burger.", "It's pizza.", "It's cake."], correctIndex: 0 },
                { question: "What is it?", image: "🍦", options: ["It's chips.", "It's ice cream.", "It's a burger."], correctIndex: 1 },
                { question: "What is it?", image: "🍎", options: ["It's an apple.", "It's a burger.", "It's pizza."], correctIndex: 0 },
                { question: "What is it?", image: "🍟", options: ["It's ice cream.", "It's pizza.", "It's chips."], correctIndex: 2 }
            ]}
        ];

        // ---------- INITIALIZATION ----------
        window.onload = function() {
            loadProgress();
            loadShop();
            loadTopics();
        };

        function loadProgress() {
            if (localStorage.getItem('xp')) {
                xp = parseInt(localStorage.getItem('xp'));
                crystals = parseInt(localStorage.getItem('crystals'));
            }
            if (localStorage.getItem('purchasedItems')) {
                purchasedItems = JSON.parse(localStorage.getItem('purchasedItems'));
                updateLilyAccessories();
            }
        }

        function saveProgress() {
            localStorage.setItem('xp', xp);
            localStorage.setItem('crystals', crystals);
            localStorage.setItem('purchasedItems', JSON.stringify(purchasedItems));
        }

        function updateUI() {
            document.getElementById('xp-fill').style.width = (xp % 100) + '%';
            document.getElementById('crystal-count').innerText = '💎 ' + crystals;
            document.getElementById('crystal-count').style.animation = 'none';
            document.getElementById('crystal-count').offsetHeight;
            document.getElementById('crystal-count').style.animation = 'crystalSpin 0.5s';
        }

        // ---------- SCREEN NAVIGATION ----------
        function startGame() {
            document.getElementById('presentation-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
            loadTopics();
            speakText("Hi! I'm Lily! Let's choose a topic!", true);
        }

        function backToPresentation() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('presentation-screen').style.display = 'flex';
        }

        function backToMenu() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
            loadTopics();
        }

        // ---------- TOPICS LOGIC ----------
        function loadTopics() {
            const topicsDiv = document.getElementById('topics-list');
            topicsDiv.innerHTML = "";
            
            topics.forEach(topic => {
                const topicCard = document.createElement('div');
                topicCard.className = 'topic-card';
                
                if (xp < topic.xpRequired) {
                    topicCard.classList.add('locked');
                }
                
                topicCard.innerHTML = `
                    <div class="topic-emoji">${topic.emoji}</div>
                    <div class="topic-name">${topic.name}</div>
                    <div class="topic-xp">Requires: ${topic.xpRequired} XP</div>
                    ${xp < topic.xpRequired ? '<div class="lock-icon">🔒</div>' : ''}
                `;
                
                if (xp >= topic.xpRequired) {
                    topicCard.onclick = () => selectTopic(topic);
                }
                
                topicsDiv.appendChild(topicCard);
            });
        }

        function selectTopic(topic) {
            currentTopic = topic;
            currentQuestionIndex = 0;
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('game-title').innerText = topic.name;
            loadQuestion();
            speakText(topic.name, true);
        }

        // ---------- QUESTION LOGIC ----------
        function loadQuestion() {
            if (currentQuestionIndex >= currentTopic.questions.length) {
                currentQuestionIndex = 0;
            }
            
            currentQuestion = currentTopic.questions[currentQuestionIndex];
            correctAnswerText = currentQuestion.options[currentQuestion.correctIndex];

            document.getElementById('question-text').innerHTML = currentQuestion.image + "<br>" + currentQuestion.question;
            document.getElementById('feedback').innerText = "";
            document.getElementById('mic-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';

            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = "";

            currentQuestion.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.innerText = option;
                btn.className = 'answer-btn';
                btn.style.animationDelay = (index * 0.1) + 's';
                btn.onclick = () => selectAnswer(index, btn);
                answersDiv.appendChild(btn);
            });
        }

        function selectAnswer(index, btn) {
            const buttons = document.querySelectorAll('.answer-btn');
            
            if (index === currentQuestion.correctIndex) {
                buttons.forEach(b => b.disabled = true);
                btn.classList.add('correct');
                document.getElementById('feedback').innerHTML = "Great! Now say it aloud!";
                document.getElementById('feedback').style.color = '#4CAF50';
                document.getElementById('lily-img').classList.add('jumping');
                setTimeout(() => document.getElementById('lily-img').classList.remove('jumping'), 800);
                
                document.getElementById('mic-btn').style.display = 'inline-block';
                speakText(correctAnswerText, true);
            } else {
                btn.classList.add('wrong');
                btn.disabled = true;
                document.getElementById('feedback').innerHTML = "Oops! Try again!";
                document.getElementById('feedback').style.color = '#f44336';
                document.getElementById('lily-img').classList.add('shaking');
                setTimeout(() => document.getElementById('lily-img').classList.remove('shaking'), 500);
            }
        }

        // ---------- VOICE LOGIC ----------
        function speakText(text, slow = false) {
            if (!('speechSynthesis' in window)) {
                alert("Speech synthesis not supported.");
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = slow ? 0.7 : 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function startListening() {
            const micBtn = document.getElementById('mic-btn');
            micBtn.classList.add('active');
            micBtn.innerText = "Listening...";

            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.start();

            recognition.onresult = (event) => {
                const spokenText = event.results[0][0].transcript.toLowerCase();
                const cleanSpoken = spokenText.trim().replace(/[.,!?;:]/g, '');
                const cleanCorrect = correctAnswerText.toLowerCase().replace(/[.,!?;:]/g, '');

                if (cleanSpoken.includes(cleanCorrect) || cleanCorrect.includes(cleanSpoken)) {
                    xp += 10;
                    crystals += 5;
                    saveProgress();
                    updateUI();
                    
                    createConfetti();
                    
                    micBtn.classList.remove('active');
                    micBtn.style.display = 'none';
                    document.getElementById('feedback').innerHTML = "Excellent! +10 XP, +5 💎!";
                    document.getElementById('feedback').style.color = '#4CAF50';
                    document.getElementById('lily-img').classList.add('jumping');
                    setTimeout(() => document.getElementById('lily-img').classList.remove('jumping'), 800);
                    document.getElementById('next-btn').style.display = 'inline-block';
                } else {
                    micBtn.classList.remove('active');
                    micBtn.innerText = "🎤 Try Again";
                    document.getElementById('feedback').innerHTML = "Not quite. Listen to Lily and try again!";
                    document.getElementById('feedback').style.color = '#f44336';
                    document.getElementById('lily-img').classList.add('shaking');
                    setTimeout(() => document.getElementById('lily-img').classList.remove('shaking'), 500);
                    speakText(correctAnswerText, true);
                }
            };

            recognition.onerror = (event) => {
                micBtn.classList.remove('active');
                micBtn.innerText = "🎤 Say it!";
                alert("Microphone error: " + event.error + ". Please try again.");
            };

            recognition.onend = () => {
                if(micBtn.classList.contains('active')){
                    micBtn.classList.remove('active');
                    micBtn.innerText = "🎤 Say it!";
                }
            };
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        // ---------- SHOP LOGIC ----------
        function openShop() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('shop-screen').style.display = 'block';
            document.getElementById('shop-crystals').innerText = '💎 ' + crystals;
        }

        function closeShop() {
            document.getElementById('shop-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
            loadTopics();
            updateUI();
        }

        function loadShop() {
            const shopDiv = document.getElementById('shop-items');
            shopDiv.innerHTML = "";
            
            shopItems.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'shop-item';
                if (purchasedItems.includes(item.id)) {
                    itemDiv.classList.add('bought');
                }
                itemDiv.innerHTML = `
                    <div>${item.emoji}</div>
                    <div>${item.name}</div>
                    <div class="price">💎 ${item.price}</div>
                `;
                itemDiv.onclick = () => buyItem(item, itemDiv);
                shopDiv.appendChild(itemDiv);
            });
        }

        function buyItem(item, element) {
            if (purchasedItems.includes(item.id)) {
                alert("You already have this!");
                return;
            }
            
            if (crystals >= item.price) {
                crystals -= item.price;
                purchasedItems.push(item.id);
                saveProgress();
                updateUI();
                element.classList.add('bought');
                document.getElementById('shop-crystals').innerText = '💎 ' + crystals;
                updateLilyAccessories();
                
                createConfetti();
                alert("🎉 You got " + item.name + "!");
            } else {
                alert("Not enough crystals! Earn more by playing!");
            }
        }

        function updateLilyAccessories() {
            const accessoriesDiv = document.getElementById('lily-accessories');
            accessoriesDiv.innerHTML = "";
            
            purchasedItems.forEach(itemId => {
                const item = shopItems.find(i => i.id === itemId);
                if (item) {
                    const accessorySpan = document.createElement('span');
                    accessorySpan.innerText = item.emoji;
                    accessorySpan.style.margin = '0 5px';
                    accessoriesDiv.appendChild(accessorySpan);
                }
            });
        }

        // ---------- CONFETTI ANIMATION ----------
        function createConfetti() {
            const container = document.getElementById('game-container');
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#2196f3', '#4caf50', '#ff9800', '#ffeb3b', '#00bcd4'];
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = Math.random() * -50 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                confetti.style.animationDuration = Math.random() * 2 + 1 + 's';
                container.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 3500);
            }
        }
    </script>
</body>
</html>
