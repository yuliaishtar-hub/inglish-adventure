<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <style>
        body { font-family: 'Comic Sans MS', 'Comic Sans', cursive; background-color: #87CEEB; text-align: center; padding: 20px; }
        #game-container { background-color: #fff; border-radius: 20px; padding: 20px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #4CAF50; }
        
        .pair-game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; }
        .pair-card { background-color: #f0f8ff; border: 2px solid #4CAF50; border-radius: 15px; padding: 15px; cursor: pointer; transition: 0.3s; }
        .pair-card:hover { background-color: #dcedc8; }
        .pair-card.matched { background-color: #a5d6a7; border-color: #4caf50; }
        .pair-card img { width: 80px; height: 80px; object-fit: contain; }
        .pair-card .word { font-size: 18px; font-weight: bold; margin-top: 10px; }
        
        #exit-btn { padding: 15px 30px; font-size: 20px; background-color: #2196F3; border: none; border-radius: 10px; cursor: pointer; color: white; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Find the Pair</h1>
        <div id="pair-grid" class="pair-game-grid"></div>
        <button id="exit-btn" onclick="window.close()">Back to Map</button>
    </div>

    <script>
        // Данные из Animals
        const gameData = [
            { image: "https://yuliaishtar-hub.github.io/inglish-adventure/monkey.jpg", word: "It's a chimp." },
            { image: "https://yuliaishtar-hub.github.io/inglish-adventure/fish.jpg", word: "It's a fish." },
            { image: "https://yuliaishtar-hub.github.io/inglish-adventure/bird.jpg", word: "It's a bird." },
            { image: "https://yuliaishtar-hub.github.io/inglish-adventure/mouse.jpg", word: "It's a mouse." },
            { image: "https://yuliaishtar-hub.github.io/inglish-adventure/frog.jpg", word: "It's a frog." }
        ];

        // Создаём пары
        const allCards = [];
        for (let i = 0; i < gameData.length; i++) {
            allCards.push({ type: 'image', value: '<img src="' + gameData[i].image + '" style="width: 80px; height: 80px;">', pairId: i });
            allCards.push({ type: 'word', value: gameData[i].word, pairId: i });
        }

        // Перемешиваем
        for (let i = allCards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [allCards[i], allCards[j]] = [allCards[j], allCards[i]];
        }

        let firstCard = null;
        let secondCard = null;
        let lockBoard = false;

        const grid = document.getElementById('pair-grid');
        allCards.forEach((card) => {
            const cardElement = document.createElement('div');
            cardElement.className = 'pair-card';
            cardElement.dataset.pairId = card.pairId;
            cardElement.dataset.type = card.type;
            cardElement.dataset.value = card.value;
            
            if (card.type === 'image') {
                cardElement.innerHTML = card.value;
            } else {
                cardElement.innerHTML = '<div class="word">' + card.value + '</div>';
            }
            
            cardElement.onclick = () => {
                if (lockBoard) return;
                if (cardElement.classList.contains('matched')) return;
                cardElement.classList.add('flipped');
                
                if (!firstCard) {
                    firstCard = cardElement;
                } else if (!secondCard) {
                    secondCard = cardElement;
                    lockBoard = true;
                    
                    if (firstCard.dataset.pairId === secondCard.dataset.pairId) {
                        firstCard.classList.add('matched');
                        secondCard.classList.add('matched');
                        firstCard = null;
                        secondCard = null;
                        lockBoard = false;
                    } else {
                        setTimeout(() => {
                            firstCard.classList.remove('flipped');
                            secondCard.classList.remove('flipped');
                            firstCard = null;
                            secondCard = null;
                            lockBoard = false;
                        }, 1000);
                    }
                }
            };
            grid.appendChild(cardElement);
        });
    </script>
</body>
</html>
