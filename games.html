<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Quest — Games 🎮</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Verdana,sans-serif;
  background:linear-gradient(135deg,#cfeeff,#f7d9ff,#ffe1ee);
  color:#30305c;
}

#app{
  max-width:980px;
  margin:0 auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:30px;
  padding:28px;
  box-shadow:0 16px 40px #54317b22;
}

h1{
  font-size:48px;
  color:#6339a6;
  margin:0 0 8px;
}

.subtitle{
  font-size:20px;
  color:#666;
  margin-bottom:22px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

button{
  font:inherit;
}

.secondary,
.primary,
.listen,
.speak{
  border:0;
  border-radius:16px;
  padding:12px 18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 7px 16px #00000018;
  transition:.18s;
}

.secondary{
  background:#fff;
  color:#6339a6;
  border:2px solid #d8c6f7;
}

.primary{
  background:linear-gradient(135deg,#ff5f8d,#9b5cff);
  color:#fff;
}

.listen{
  background:#eadbff;
  color:#6339a6;
}

.speak{
  background:#ff638d;
  color:#fff;
}

button:hover{
  transform:translateY(-2px);
}

button:disabled{
  cursor:default;
  opacity:1;
}

button:disabled:hover{
  transform:none;
}

/* =========================
   GAMES MENU
========================= */

.screen{
  display:none;
}

.screen.active{
  display:block;
}

.games-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.game-card{
  border:0;
  border-radius:24px;
  background:#fff;
  padding:0;
  overflow:hidden;
  cursor:pointer;
  text-align:left;
  box-shadow:0 9px 22px #00000013;
  transition:.18s;
}

.game-card:hover{
  transform:translateY(-5px);
  box-shadow:0 14px 28px #00000018;
}

.game-img{
  width:100%;
  height:150px;
  object-fit:contain;
  background:#f1ebfa;
  padding:8px;
}

.game-body{
  padding:15px;
}

.game-title{
  font-size:22px;
  font-weight:900;
  color:#6339a6;
}

.game-sub{
  font-size:14px;
  color:#777;
  margin-top:5px;
}

/* =========================
   GAME SCREEN
========================= */

.game-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.game-head h2{
  margin:0;
  font-size:30px;
  color:#6339a6;
}

.game-progress{
  margin-top:10px;
  color:#777;
  font-weight:800;
}

.question{
  text-align:center;
  font-size:28px;
  font-weight:900;
  margin:20px 0;
}

.big-image{
  width:min(100%,520px);
  height:280px;
  object-fit:contain;
  background:#f7f4ff;
  border-radius:24px;
  display:block;
  margin:auto;
  padding:10px;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:20px;
}

.answer{
  border:2px solid #e2ddec;
  background:#fff;
  border-radius:18px;
  padding:15px;
  cursor:pointer;
  font-size:18px;
  font-weight:800;
  color:#45416d;
  transition:.15s;
}

.answer:hover{
  background:#f6f0ff;
  transform:translateY(-2px);
}

.answer.correct{
  background:#c9f5d0;
  border-color:#4caf68;
}

.answer.wrong{
  background:#ffd1d8;
  border-color:#f05c70;
}

.feedback{
  text-align:center;
  min-height:38px;
  font-size:19px;
  font-weight:900;
  margin:15px;
}

.actions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:18px;
}

/* =========================
   MEMORY GAME
========================= */

.memory-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:20px;
}

.memory-card{
  height:145px;
  border:0;
  border-radius:20px;
  background:linear-gradient(135deg,#9b5cff,#ff638d);
  color:#fff;
  cursor:pointer;
  font-size:45px;
  font-weight:900;
  box-shadow:0 7px 16px #00000018;
  transition:.18s;
}

.memory-card:hover{
  transform:scale(1.02);
}

.memory-card.revealed,
.memory-card.matched{
  background:#fff;
  color:#30305c;
  border:2px solid #d8c6f7;
}

.memory-card img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:8px;
  border-radius:18px;
}

.memory-word{
  font-size:21px;
}

/* =========================
   SENTENCE GAME
========================= */

.word-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin:20px 0;
}

.word-button{
  border:2px solid #d8c6f7;
  background:#fff;
  color:#6339a6;
  border-radius:16px;
  padding:13px 18px;
  font-weight:900;
  cursor:pointer;
}

.word-button:hover{
  background:#f6f0ff;
}

.sentence-box{
  min-height:70px;
  border:3px dashed #d8c6f7;
  border-radius:20px;
  padding:15px;
  text-align:center;
  font-size:23px;
  font-weight:900;
  color:#6339a6;
  margin-top:15px;
}

/* =========================
   FINISH
========================= */

.finish{
  text-align:center;
  padding:25px 5px;
}

.finish-stars{
  font-size:60px;
}

.finish h2{
  color:#6339a6;
  font-size:36px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

  .games-grid{
    grid-template-columns:1fr 1fr;
  }

  .memory-grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:480px){

  #app{
    padding:10px;
  }

  .card{
    padding:18px;
    border-radius:22px;
  }

  h1{
    font-size:38px;
  }

  .games-grid{
    grid-template-columns:1fr;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .memory-grid{
    grid-template-columns:1fr 1fr;
  }

  .memory-card{
    height:125px;
  }

  .question{
    font-size:23px;
  }

}
</style>
</head>

<body>

<div id="app">

<!-- =========================
     GAMES MENU
========================= -->

<section id="gamesHome" class="screen active">

  <div class="topbar">

    <div>
      <h1>🎮 Games</h1>

      <div class="subtitle">
        Play, practise and learn English!
      </div>
    </div>

    <button
      class="secondary"
      onclick="goMenu()">
      ← Menu
    </button>

  </div>

  <div class="card">

    <div id="gamesGrid" class="games-grid"></div>

  </div>

</section>


<!-- =========================
     GAME SCREEN
========================= -->

<section id="gameScreen" class="screen">

  <div class="topbar">

    <button
      class="secondary"
      onclick="showGamesMap()">
      ← Games
    </button>

    <div id="gameScore">
      ⭐ 0
    </div>

  </div>

  <div class="card">

    <div class="game-head">

      <div>
        <h2 id="gameTitle"></h2>

        <div id="gameProgress" class="game-progress"></div>
      </div>

    </div>

    <div id="gameContent"></div>

  </div>

</section>

</div>


<script>

/* =========================================
   MAIN SITE ADDRESS
========================================= */

const SITE =
"https://yuliaishtar-hub.github.io/inglish-adventure/";

const IMG = SITE;


/* =========================================
   RETURN TO MAIN MENU
========================================= */

function goMenu(){

  window.location.href =
    "https://yuliaishtar-hub.github.io/inglish-adventure/index.html";

}


/* =========================================
   THEMES
========================================= */

const themes = [

  {
    key:"family",

    title:"👨‍👩‍👧 Family",

    sub:"Mummy • Daddy • Grandma • Sister",

    image:IMG+"Lili.jpg",

    items:[
      ["mummy",IMG+"mummy.jpg"],
      ["daddy",IMG+"daddy.jpg"],
      ["grandma",IMG+"grandmagrandpa.jpg"],
      ["sister",IMG+"Lilissisterbig.jpg"]
    ],

    games:[
      "quiz",
      "memory"
    ]
  },


  {
    key:"school",

    title:"🏫 School",

    sub:"Pen • Pencil • Ruler • School bag",

    image:IMG+"School bag.jpg",

    items:[
      ["pen",IMG+"pen.jpg"],
      ["pencil",IMG+"pencil.jpg"],
      ["ruler",IMG+"ruler.jpg"],
      ["school bag",IMG+"School bag.jpg"]
    ],

    games:[
      "quiz",
      "memory"
    ]
  },


  {
    key:"animals",

    title:"🐾 Pet World",

    sub:"Chimp • Fish • Bird • Mouse",

    image:IMG+"monkey.jpg",

    items:[
      ["chimp",IMG+"monkey.jpg"],
      ["fish",IMG+"fish.jpg"],
      ["bird",IMG+"bird.jpg"],
      ["mouse",IMG+"mouse.jpg"]
    ],

    games:[
      "quiz",
      "memory"
    ]
  },


  {
    key:"colours",

    title:"🎨 Colours",

    sub:"Red • Blue • Green • Yellow",

    image:null,

    items:[
      ["red","🔴"],
      ["blue","🔵"],
      ["green","🟢"],
      ["yellow","🟡"]
    ],

    games:[
      "quiz",
      "memory"
    ]
  },


  {
    key:"food",

    title:"🍕 Food",

    sub:"Apple • Pizza • Burger • Ice cream",

    image:IMG+"Pizza.jpg",

    items:[
      ["apple",IMG+"Apple.jpg"],
      ["pizza",IMG+"Pizza.jpg"],
      ["burger",IMG+"Burger.jpg"],
      ["ice cream",IMG+"Ice cream.jpg"]
    ],

    games:[
      "quiz",
      "memory"
    ]
  }

];


/* =========================================
   STATE
========================================= */

let currentTheme = null;
let currentGame = "";

let score = 0;

let questionIndex = 0;
let quizItems = [];

/*
  Stores the result of every quiz question.

  null = not answered
  {
    correct:true/false,
    selected:"word"
  }
*/
let quizResults = [];


/* =========================================
   MEMORY STATE
========================================= */

let memoryCards = [];

let memoryFirst = null;
let memorySecond = null;

let memoryLocked = false;
let memoryMatches = 0;

/*
  Order of successfully matched pairs.
  Used for the Back button.
*/
let memoryMatchedPairs = [];

/*
  Pairs that already gave a point.

  This prevents score farming:
  match → Back → match again
  will NOT give another point.
*/
let memoryScoredPairs = new Set();

let memoryFinishTimer = null;


/* =========================================
   SCREEN
========================================= */

function show(id){

  document
    .querySelectorAll(".screen")
    .forEach(s =>
      s.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo(0,0);

}


/* =========================================
   GAMES MENU
========================================= */

function showGamesMap(){

  clearTimeout(memoryFinishTimer);

  renderThemes();

  show("gamesHome");

}


/* =========================================
   RENDER THEMES
========================================= */

function renderThemes(){

  const grid =
    document.getElementById("gamesGrid");

  grid.innerHTML = "";

  themes.forEach(theme => {

    const b =
      document.createElement("button");

    b.className = "game-card";

    let imageHTML;

    if(theme.image){

      imageHTML = `
        <img
          class="game-img"
          src="${theme.image}"
          alt="">
      `;

    }else{

      imageHTML = `
        <div
          class="game-img"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:80px;">
          🎨
        </div>
      `;

    }

    b.innerHTML = `

      ${imageHTML}

      <div class="game-body">

        <div class="game-title">
          ${theme.title}
        </div>

        <div class="game-sub">
          ${theme.sub}
        </div>

      </div>
    `;

    b.onclick =
      () => openThemeGames(theme.key);

    grid.appendChild(b);

  });

}


/* =========================================
   THEME → TWO GAMES
========================================= */

function openThemeGames(key){

  clearTimeout(memoryFinishTimer);

  currentTheme =
    themes.find(t => t.key === key);

  document.getElementById("gameTitle")
    .textContent =
      currentTheme.title;

  document.getElementById("gameScore")
    .textContent =
      "⭐ 0";

  document.getElementById("gameProgress")
    .textContent =
      "Choose a game";

  const box =
    document.getElementById("gameContent");

  box.innerHTML = `

    <div class="question">
      Choose your game! 🎮
    </div>

    <div class="games-grid">

      <button
        class="game-card"
        onclick="startGame('quiz')">

        <div
          class="game-img"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:75px;">
          🧠
        </div>

        <div class="game-body">

          <div class="game-title">
            Quiz
          </div>

          <div class="game-sub">
            Look, choose and say!
          </div>

        </div>

      </button>


      <button
        class="game-card"
        onclick="startGame('memory')">

        <div
          class="game-img"
          style="
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:75px;">
          🃏
        </div>

        <div class="game-body">

          <div class="game-title">
            Memory
          </div>

          <div class="game-sub">
            Find the matching pairs!
          </div>

        </div>

      </button>

    </div>

  `;

  show("gameScreen");

}


/* =========================================
   START GAME
========================================= */

function startGame(type){

  clearTimeout(memoryFinishTimer);

  currentGame = type;
  score = 0;

  document.getElementById("gameScore")
    .textContent =
      "⭐ 0";

  if(type === "quiz"){

    startQuiz();

  }

  if(type === "memory"){

    startMemory();

  }

}


/* =========================================
   QUIZ
========================================= */

function startQuiz(){

  questionIndex = 0;

  quizItems =
    [...currentTheme.items]
      .sort(() => Math.random() - .5);

  quizResults =
    Array(quizItems.length).fill(null);

  renderQuiz();

}


/* =========================================
   QUIZ QUESTION
========================================= */

function renderQuiz(){

  const item =
    quizItems[questionIndex];

  if(!item)
    return;

  const box =
    document.getElementById("gameContent");

  document.getElementById("gameProgress")
    .textContent =
      `Question ${questionIndex+1} / ${quizItems.length}`;


  /* ---------------------------------------
     IMAGE
  --------------------------------------- */

  let imageHTML;

  if(item[1].startsWith("http")){

    imageHTML = `
      <img
        class="big-image"
        src="${item[1]}"
        alt="">
    `;

  }else{

    imageHTML = `
      <div
        class="big-image"
        style="
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:120px;">
        ${item[1]}
      </div>
    `;

  }


  /* ---------------------------------------
     ANSWERS
  --------------------------------------- */

  const correct =
    item[0];

  const otherWords =
    currentTheme.items
      .map(x => x[0])
      .filter(x => x !== correct)
      .sort(() => Math.random()-.5)
      .slice(0,2);

  const options =
    [correct,...otherWords]
      .sort(() => Math.random()-.5);


  box.innerHTML = `

    ${imageHTML}

    <div class="question">
      What is it?
    </div>

    <button
      class="listen"
      onclick="speak('What is it?')">
      🔊 Listen
    </button>

    <div
      id="answers"
      class="answers">
    </div>

    <div
      id="feedback"
      class="feedback">
    </div>

    <div class="actions">

      <button
        class="secondary"
        onclick="previousQuiz()">
        ← Back
      </button>

      <button
        id="nextQuiz"
        class="primary"
        style="display:none"
        onclick="nextQuiz()">
        Next ➡️
      </button>

    </div>
  `;


  const answers =
    document.getElementById("answers");


  options.forEach(word => {

    const b =
      document.createElement("button");

    b.className = "answer";

    b.textContent =
      "It's a " + word + ".";

    b.onclick =
      () => checkQuiz(
        word,
        b,
        correct
      );

    answers.appendChild(b);

  });


  /*
    If this question was already answered,
    restore its previous state.

    This is what prevents Back from creating
    another chance to earn another point.
  */

  const previous =
    quizResults[questionIndex];

  if(previous){

    document
      .querySelectorAll(".answer")
      .forEach(b => {

        b.disabled = true;

        const word =
          b.textContent
            .replace("It's a ","")
            .replace(".","");

        if(word === correct){

          b.classList.add("correct");

        }

        if(
          word === previous.selected &&
          !previous.correct
        ){

          b.classList.add("wrong");

        }

      });


    const feedback =
      document.getElementById("feedback");


    if(previous.correct){

      feedback.textContent =
        "Great! ⭐";

      feedback.style.color =
        "#39964e";

    }else{

      feedback.textContent =
        "Good try! The answer is " +
        correct + ".";

      feedback.style.color =
        "#e2536c";

    }


    document.getElementById("nextQuiz")
      .style.display =
        "inline-block";

  }

}


/* =========================================
   CHECK QUIZ
========================================= */

function checkQuiz(
  word,
  button,
  correct
){

  /*
    If already answered,
    do nothing.
  */

  if(quizResults[questionIndex])
    return;


  document
    .querySelectorAll(".answer")
    .forEach(b =>
      b.disabled = true
    );


  const feedback =
    document.getElementById("feedback");


  const isCorrect =
    word === correct;


  /*
    Save result BEFORE changing question.

    This makes the Back button safe.
  */

  quizResults[questionIndex] = {

    correct:isCorrect,

    selected:word

  };


  if(isCorrect){

    button.classList.add("correct");

    score++;

    document.getElementById("gameScore")
      .textContent =
        "⭐ " + score;

    feedback.textContent =
      "Great! ⭐ Say it aloud!";

    feedback.style.color =
      "#39964e";

    speak(
      "It's a " + correct + ".",
      true
    );

  }else{

    button.classList.add("wrong");

    feedback.textContent =
      "Good try! The answer is " +
      correct + ".";

    feedback.style.color =
      "#e2536c";

    speak(
      "It's a " + correct + ".",
      true
    );

  }


  document.getElementById("nextQuiz")
    .style.display =
      "inline-block";

}


/* =========================================
   NEXT QUIZ
========================================= */

function nextQuiz(){

  if(
    questionIndex >=
    quizItems.length - 1
  ){

    finishGame();

    return;

  }

  questionIndex++;

  renderQuiz();

}


/* =========================================
   PREVIOUS QUIZ
========================================= */

function previousQuiz(){

  /*
    If we are on the finish screen,
    questionIndex equals quizItems.length.
  */

  if(
    questionIndex >=
    quizItems.length
  ){

    questionIndex =
      quizItems.length - 1;

    renderQuiz();

    return;

  }


  /*
    Previous question.
  */

  if(questionIndex > 0){

    questionIndex--;

    renderQuiz();

    return;

  }


  /*
    First question:
    return to this theme's game menu.
  */

  openThemeGames(
    currentTheme.key
  );

}


/* =========================================
   MEMORY GAME
========================================= */

function startMemory(){

  clearTimeout(memoryFinishTimer);

  memoryFirst = null;
  memorySecond = null;

  memoryLocked = false;

  memoryMatches = 0;

  memoryMatchedPairs = [];

  memoryScoredPairs =
    new Set();


  const items =
    [...currentTheme.items];

  memoryCards = [];


  items.forEach((item,index) => {

    memoryCards.push({

      id:index,

      type:"picture",

      word:item[0],

      image:item[1],

      pair:index,

      matched:false

    });


    memoryCards.push({

      id:index + 100,

      type:"word",

      word:item[0],

      image:item[1],

      pair:index,

      matched:false

    });

  });


  memoryCards =
    memoryCards.sort(
      () => Math.random()-.5
    );


  document.getElementById("gameProgress")
    .textContent =
      "Find all the pairs";


  renderMemory();

}


/* =========================================
   MEMORY CARD FACE
========================================= */

function memoryCardFace(card){

  if(card.type === "picture"){

    if(card.image.startsWith("http")){

      return `
        <img
          src="${card.image}"
          alt="">
      `;

    }

    return `
      <div style="
        display:flex;
        align-items:center;
        justify-content:center;
        height:100%;
        font-size:75px;">
        ${card.image}
      </div>
    `;

  }


  return `
    <div class="memory-word">
      ${card.word}
    </div>
  `;

}


/* =========================================
   RENDER MEMORY
========================================= */

function renderMemory(){

  const box =
    document.getElementById("gameContent");

  box.innerHTML = `

    <div class="question">
      Find the picture and the matching word! 🃏
    </div>

    <div
      id="memoryGrid"
      class="memory-grid">
    </div>

    <div
      id="memoryFeedback"
      class="feedback">
    </div>

    <div class="actions">

      <button
        class="secondary"
        onclick="previousMemory()">
        ← Back
      </button>

    </div>

  `;


  const grid =
    document.getElementById("memoryGrid");


  memoryCards.forEach(card => {

    const button =
      document.createElement("button");

    button.className =
      "memory-card";

    button.dataset.id =
      card.id;


    if(card.matched){

      button.classList.add("matched");

      button.innerHTML =
        memoryCardFace(card);

    }else{

      button.innerHTML =
        "<span>❓</span>";

    }


    button.onclick =
      () => revealMemory(
        card,
        button
      );


    grid.appendChild(button);

  });

}


/* =========================================
   MEMORY CARD
========================================= */

function revealMemory(
  card,
  button
){

  if(memoryLocked)
    return;

  if(card.matched)
    return;

  if(button.classList.contains("revealed"))
    return;


  button.classList.add("revealed");

  button.innerHTML =
    memoryCardFace(card);


  if(!memoryFirst){

    memoryFirst = {

      card,
      button

    };

    return;

  }


  memorySecond = {

    card,
    button

  };

  memoryLocked = true;


  /* ---------------------------------------
     MATCH
  --------------------------------------- */

  if(
    memoryFirst.card.pair ===
    memorySecond.card.pair
  ){

    const pair =
      memoryFirst.card.pair;


    memoryFirst.card.matched = true;

    memorySecond.card.matched = true;


    memoryFirst.button
      .classList.add("matched");

    memorySecond.button
      .classList.add("matched");


    memoryMatches++;

    /*
      Only the first successful match
      gives a point.

      If the child uses Back and matches
      the same pair again, no extra point.
    */

    if(
      !memoryScoredPairs.has(pair)
    ){

      memoryScoredPairs.add(pair);

      score++;

      document.getElementById("gameScore")
        .textContent =
          "⭐ " + score;

    }


    memoryMatchedPairs.push(pair);


    const feedback =
      document.getElementById(
        "memoryFeedback"
      );


    feedback.textContent =
      "Match! Great job! 🎉";

    feedback.style.color =
      "#39964e";


    speak(
      memoryFirst.card.word
    );


    memoryFirst = null;
    memorySecond = null;
    memoryLocked = false;


    /*
      Finish only when all current pairs
      are matched.
    */

    if(
      memoryMatches >=
      currentTheme.items.length
    ){

      clearTimeout(memoryFinishTimer);

      memoryFinishTimer =
        setTimeout(
          finishGame,
          700
        );

    }


    return;

  }


  /* ---------------------------------------
     NOT A MATCH
  --------------------------------------- */

  const first =
    memoryFirst;

  const second =
    memorySecond;


  document.getElementById(
    "memoryFeedback"
  ).textContent =
    "Not a match. Try again!";


  document.getElementById(
    "memoryFeedback"
  ).style.color =
    "#e2536c";


  setTimeout(() => {

    first.button
      .classList.remove("revealed");

    second.button
      .classList.remove("revealed");


    first.button.innerHTML =
      "<span>❓</span>";

    second.button.innerHTML =
      "<span>❓</span>";


    memoryFirst = null;

    memorySecond = null;

    memoryLocked = false;

  },800);

}


/* =========================================
   PREVIOUS MEMORY
========================================= */

function previousMemory(){

  /*
    Never interrupt the moment when two
    cards are being checked.
  */

  if(memoryLocked)
    return;


  /*
    If one card is currently open,
    Back closes that card first.
  */

  if(
    memoryFirst &&
    !memorySecond
  ){

    memoryFirst.button
      .classList.remove("revealed");

    memoryFirst.button.innerHTML =
      "<span>❓</span>";

    memoryFirst = null;

    return;

  }


  /*
    If there are completed rounds,
    undo the latest matched pair.
  */

  if(memoryMatchedPairs.length > 0){

    clearTimeout(memoryFinishTimer);

    memoryFinishTimer = null;


    const lastPair =
      memoryMatchedPairs.pop();


    memoryCards.forEach(card => {

      if(card.pair === lastPair){

        card.matched = false;

      }

    });


    memoryMatches--;


    /*
      IMPORTANT:
      score is NOT decreased.

      The pair has already earned its point.
      Repeating it after Back cannot farm
      extra points.
    */


    renderMemory();

    document.getElementById(
      "memoryFeedback"
    ).textContent =
      "Back to the previous round.";

    return;

  }


  /*
    First round:
    return to this theme's game menu.
  */

  openThemeGames(
    currentTheme.key
  );

}


/* =========================================
   FINISH
========================================= */

function finishGame(){

  clearTimeout(memoryFinishTimer);

  memoryFinishTimer = null;


  const box =
    document.getElementById("gameContent");


  document.getElementById("gameProgress")
    .textContent =
      "Complete!";


  box.innerHTML = `

    <div class="finish">

      <div class="finish-stars">
        🌟🏆🌟
      </div>

      <h2>
        Well done!
      </h2>

      <p style="
        font-size:21px;
        line-height:1.5;">

        You finished the game!

        <br>

        Your score: ⭐ ${score}

      </p>


      <div class="actions">

        <button
          class="secondary"
          onclick="previousGameStep()">
          ← Back
        </button>


        <button
          class="primary"
          onclick="startGame(currentGame)">
          🔄 Play again
        </button>


        <button
          class="secondary"
          onclick="openThemeGames(currentTheme.key)">
          🎮 Other game
        </button>


        <button
          class="secondary"
          onclick="showGamesMap()">
          ← Games
        </button>

      </div>

    </div>

  `;

}


/* =========================================
   BACK FROM FINISH
========================================= */

function previousGameStep(){

  if(currentGame === "quiz"){

    previousQuiz();

    return;

  }


  if(currentGame === "memory"){

    previousMemory();

    return;

  }

}


/* =========================================
   VOICE
========================================= */

function speak(
  text,
  slow=false
){

  if(
    !("speechSynthesis" in window)
  )
    return;


  speechSynthesis.cancel();


  const u =
    new SpeechSynthesisUtterance(
      text
    );


  u.lang =
    "en-US";


  u.rate =
    slow ? .72 : .82;


  u.pitch =
    1.08;


  u.volume =
    1;


  speechSynthesis.speak(u);

}


/* =========================================
   START
========================================= */

showGamesMap();

</script>
