name: Add Gift choice

on:
  push:
    paths:
      - '.github/workflows/add-gift-choice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gift zone
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '<section id="reward" class="screen"><div class="card reward"><div class="stars">🌟🏆🌟</div><h2 id="rewardTitle">Well done!</h2><p id="rewardText" style="font-size:20px"></p><button id="continueBtn" class="primary" type="button">Continue Adventure 🗺️</button></div></section>'
          new = '<section id="reward" class="screen"><div class="card reward"><div class="stars" id="rewardIcon">🌟🏆🌟</div><h2 id="rewardTitle">Well done!</h2><p id="rewardText" style="font-size:20px"></p><div id="giftChoices" style="display:none;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0"></div><button id="continueBtn" class="primary" type="button">Continue Adventure 🗺️</button></div></section>'
          if old in s:
              s = s.replace(old, new)

          s = s.replace('{key:"boss",icon:"👑",title:"Boss Castle",sub:"Big conversation",image:IMG+"Lili.jpg"}', '{key:"boss",icon:"🎁",title:"Gift",sub:"Choose your gift",image:IMG+"Lili.jpg"}')
          s = s.replace('{key:"boss",icon:"👑",title:"Gift",sub:"Big conversation",image:IMG+"Lili.jpg"}', '{key:"boss",icon:"🎁",title:"Gift",sub:"Choose your gift",image:IMG+"Lili.jpg"}')
          s = s.replace('{key:"boss",icon:"🎁",title:"Gift",sub:"Big conversation",image:IMG+"Lili.jpg"}', '{key:"boss",icon:"🎁",title:"Gift",sub:"Choose your gift",image:IMG+"Lili.jpg"}')

          s = s.replace('boss:{name:"👑 Boss Castle",questions:', 'boss:{name:"🎁 Gift",type:"gift",questions:')
          s = s.replace('boss:{name:"🎁 Gift",questions:', 'boss:{name:"🎁 Gift",type:"gift",questions:')

          if 'const giftChoices=' not in s:
              marker = 'const DEFAULT_STATE='
              gift_data = '''const giftChoices=[
  {icon:"🎒",name:"School Bag",text:"A new school bag for Lily!"},
  {icon:"🧸",name:"Teddy Bear",text:"A cute teddy bear for Lily!"},
  {icon:"👗",name:"Dress",text:"A beautiful dress for Lily!"},
  {icon:"🎨",name:"Art Set",text:"A colourful art set for Lily!"},
  {icon:"📚",name:"Books",text:"New English books for Lily!"},
  {icon:"🎮",name:"Game",text:"A fun new game for Lily!"}
];
'''
              if marker not in s:
                  raise SystemExit('DEFAULT_STATE marker not found')
              s = s.replace(marker, gift_data + marker)

          old_start = 'function startLevel(key){if(!levels[key])return;currentKey=key;currentIndex=0;answered=false;spokenRewarded=false;storyMode=levels[key].type==="story";const title=document.getElementById("lessonTitle");if(title)title.textContent=levels[key].name;show("lesson");renderLesson()}'
          new_start = 'function startLevel(key){if(!levels[key])return;currentKey=key;currentIndex=0;answered=false;spokenRewarded=false;storyMode=levels[key].type==="story";if(levels[key].type==="gift"){showGift();return}const title=document.getElementById("lessonTitle");if(title)title.textContent=levels[key].name;show("lesson");renderLesson()}'
          if old_start in s:
              s = s.replace(old_start, new_start)

          if 'function showGift()' not in s:
              marker = 'function finishLevel(){'
              gift_funcs = '''function showGift(){
  show("reward");
  document.getElementById("rewardIcon").textContent="🎁";
  document.getElementById("rewardTitle").textContent="Choose your gift!";
  document.getElementById("rewardText").textContent="Choose one gift for Lily!";
  const box=document.getElementById("giftChoices");
  box.style.display="grid";
  box.innerHTML="";
  giftChoices.forEach(g=>{
    const b=document.createElement("button");
    b.className="secondary";
    b.style.cssText="padding:18px 10px;font-weight:900;font-size:17px;min-height:120px";
    b.innerHTML=`<div style="font-size:42px">${g.icon}</div><div>${g.name}</div>`;
    b.onclick=()=>chooseGift(g);
    box.appendChild(b);
  });
  document.getElementById("continueBtn").textContent="Back to Map 🗺️";
}
function chooseGift(g){
  document.getElementById("giftChoices").innerHTML=`<div style="grid-column:1/-1;font-size:24px;font-weight:900;padding:25px">${g.icon} ${g.text}<br><span style="font-size:18px;color:#777">Gift chosen! 🎉</span></div>`;
  document.getElementById("continueBtn").textContent="Continue Adventure 🗺️";
}
'''
              if marker not in s:
                  raise SystemExit('finishLevel marker not found')
              s = s.replace(marker, gift_funcs + marker)

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-gift-choice.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Make Gift zone choose a gift'
          git push
