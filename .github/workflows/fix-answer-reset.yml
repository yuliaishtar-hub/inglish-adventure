name: Fix answer button reset

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix answer button reset [auto]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reset answer state on navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'const taskKey=getTaskKey();answered=state.xpRewards.includes(taskKey);spokenRewarded=state.spokenRewards.includes(taskKey);'
          new = 'const taskKey=getTaskKey();answered=false;spokenRewarded=false;'
          if old not in s:
              raise SystemExit('Target code was not found; no change made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix answer button reset [auto]'
          git push