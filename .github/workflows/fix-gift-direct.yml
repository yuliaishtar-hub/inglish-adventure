name: Fix Gift zone directly

on:
  push:
    paths:
      - '.github/workflows/fix-gift-direct.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gift zone
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('{key:"boss",icon:"👑",title:"Gift",sub:"Big conversation",image:IMG+"Lili.jpg"}', '{key:"boss",icon:"🎁",title:"Gift",sub:"Choose your gift",image:IMG+"Lili.jpg"}')
          s=s.replace('boss:{name:"🎁 Gift"}', 'boss:{name:"🎁 Gift",type:"gift"}')
          if 'id="giftChoices"' not in s:
              s=s.replace('<div class="stars">🌟🏆🌟</div><h2 id="rewardTitle">Well done!</h2>', '<div class="stars" id="rewardIcon">🌟🏆🌟</div><h2 id="rewardTitle">Well done!</h2>')
              s=s.replace('<p id="rewardText" style="font-size:20px"></p><button id="continueBtn"', '<p id="rewardText" style="font-size:20px"></p><div id="giftChoices" style="display:none;grid-template-columns:repeat(3,1fr);gap:14px;margin:25px 0"></div><button id="continueBtn"')
          if 'const giftChoices=' not in s:
              marker='const PLAYER_KEY="english_quest_v2";'
              gift='''const giftChoices=[
  {icon:"🎒",name:"School Bag",text:"A new school bag for Lily!"},
  {icon:"🧸",name:"Teddy Bear",text:"A cute teddy bear for Lily!"},
  {icon:"👗",name:"Dress",text:"A beautiful dress for Lily!"},
  {icon:"🎨",name:"Art Set",text:"A colourful art set for Lily!"},
  {icon:"📚",name:"Books",text:"New English books for Lily!"},
  {icon:"🎮",name:"Game",text:"A fun new game for Lily!"}
];

'''
              if marker not in s: raise SystemExit('PLAYER_KEY not found')
              s=s.replace(marker,gift+marker,1)
          if 'type==="gift"' not in s:
              old='storyMode=levels[key].type==="story";renderLesson();show("lesson")}'
              new='storyMode=levels[key].type==="story";if(levels[key].type==="gift"){showGift();return}renderLesson();show("lesson")}'
              if old not in s: raise SystemExit('startLevel target not found')
              s=s.replace(old,new,1)
          if 'function showGift()' not in s:
              marker='function finishLevel(){'
              funcs='''function showGift(){
  show("reward");
  document.getElementById("rewardIcon").textContent="🎁";
  document.getElementById("rewardTitle").textContent="Choose your gift!";
  document.getElementById("rewardText").textContent="Choose one gift for Lily!";
  const box=document.getElementById("giftChoices");
  box.style.display="grid";
  box.innerHTML="";
  giftChoices.forEach(g=>{
    const b=document.createElement("button");
    b.className="secondary";
    b.style.cssText="padding:18px 10px;font-weight:900;font-size:17px;min-height:120px";
    b.innerHTML=`<div style="font-size:42px">${g.icon}</div><div>${g.name}</div>`;
    b.onclick=()=>chooseGift(g);
    box.appendChild(b);
  });
  document.getElementById("continueBtn").textContent="Back to Map 🗺️";
}
function chooseGift(g){
  document.getElementById("giftChoices").innerHTML=`<div style="grid-column:1/-1;font-size:24px;font-weight:900;padding:25px">${g.icon} ${g.text}<br><span style="font-size:18px;color:#777">Gift chosen! 🎉</span></div>`;
  document.getElementById("continueBtn").textContent="Continue Adventure 🗺️";
}

'''
              if marker not in s: raise SystemExit('finishLevel target not found')
              s=s.replace(marker,funcs+marker,1)
          old_finish='function finishLevel(){if(!state.completed.includes(currentKey))state.completed.push(currentKey);save();renderMap();show("reward");'
          if old_finish in s and 'currentKey==="boss"' not in s:
              s=s.replace(old_finish,'function finishLevel(){if(!state.completed.includes(currentKey))state.completed.push(currentKey);save();renderMap();if(currentKey==="boss"){showGift();return}show("reward");',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-gift-direct.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add Gift choice screen directly'
          git push
