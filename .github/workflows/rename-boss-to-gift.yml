name: Rename Boss Castle to Gift

on:
  push:
    paths:
      - '.github/workflows/rename-boss-to-gift.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'title:"Boss Castle"'
          new = 'title:"Gift"'
          if old not in s:
              print('Nothing to change')
              raise SystemExit(0)
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Change Boss Castle to Gift'
          git push