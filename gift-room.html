<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lily's Gift Room 🎁</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Verdana,sans-serif;background:linear-gradient(135deg,#cfeeff,#f7d9ff 52%,#ffe1ee);color:#30305c}
#app{max-width:1100px;margin:auto;padding:18px}
.card{background:#fff;border-radius:30px;padding:24px;box-shadow:0 16px 40px #54317b22}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}
.brand{font-size:30px;font-weight:900;color:#6339a6}
.back{border:2px solid #d8c6f7;background:#fff;color:#6339a6;border-radius:16px;padding:12px 18px;font-weight:900;cursor:pointer}
.room{position:relative;height:650px;border-radius:28px;overflow:hidden;background:#f7f4ff;border:5px solid #eadff8;box-shadow:inset 0 0 0 2px #d8c6f7}
.room-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.room-item{position:absolute;z-index:3;cursor:pointer;transition:.18s;filter:drop-shadow(0 7px 6px #0003);border:0;background:transparent;padding:0}
.room-item:hover{transform:scale(1.08)}
.room-item img{width:100%;height:100%;object-fit:contain}
.room-item .label{position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);background:#fff;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;color:#6339a6;white-space:nowrap;box-shadow:0 3px 10px #0002;pointer-events:none}
.room-lily{width:125px;height:160px;left:7%;top:8%}
.room-bag{width:100px;height:100px;right:8%;bottom:27%}
.room-book{width:90px;height:90px;left:25%;bottom:27%}
.room-pencilcase{width:90px;height:90px;left:34%;bottom:27%}
.room-table{width:145px;height:125px;left:8%;bottom:8%}
.room-chair{width:100px;height:110px;left:29%;bottom:7%}
.room-chair2{width:100px;height:110px;left:40%;bottom:7%}
.room-bed{width:180px;height:145px;right:3%;bottom:4%}
.room-toy{width:100px;height:100px;left:46%;top:28%}
.room-toy2{width:100px;height:100px;left:57%;top:28%}
.room-pet{width:115px;height:115px;right:27%;bottom:8%}
.room-look{width:125px;height:160px;left:7%;top:8%}
.empty{text-align:center;padding:18px;font-weight:900;color:#777}
.bubble{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:24px;padding:16px 24px;box-shadow:0 10px 30px #0002;text-align:center;font-size:24px;font-weight:900;display:none;z-index:20}
.bubble.show{display:block}
.hint{text-align:center;margin:15px 0 0;color:#777;font-weight:800}
.selected{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px;justify-content:center}
.tag{background:#f2ecff;border-radius:999px;padding:8px 12px;font-weight:800;color:#6339a6}
@media(max-width:700px){.room{height:520px}.room-lily,.room-look{width:90px;height:120px}.room-bag{width:70px;height:70px}.room-book,.room-pencilcase,.room-toy,.room-toy2{width:70px;height:70px}.room-table{width:105px;height:90px}.room-chair,.room-chair2{width:75px;height:85px}.room-bed{width:125px;height:105px}.room-pet{width:80px;height:80px}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="brand">🏡 Lily's Room</div>
    <button class="back" onclick="goBack()">← Back to Gift</button>
  </div>
  <div class="card">
    <div class="room" id="room">
      <img id="roomBg" class="room-bg" src="bedroom.jpg" alt="Room">
      <div id="objects"></div>
      <div id="bubble" class="bubble"></div>
    </div>
    <div id="selected" class="selected"></div>
    <div class="hint">Click a real picture in Lily's room to hear the English sentence. 🔊</div>
  </div>
</div>
<script>
const ROOM_KEY='english_quest_room_v5';
const saved=JSON.parse(localStorage.getItem(ROOM_KEY)||'{}');
const room=saved.room||'bedroom.jpg';
const roomName=saved.roomName||'Bedroom';
const owned=Array.isArray(saved.owned)?saved.owned:[];
const items=saved.items||{};

const catalog={
 bag:{name:'School Bag',file:'School bag.jpg',phrase:'school bag',className:'room-bag'},
 book:{name:'Book',file:'book.jpg',phrase:'book',className:'room-book'},
 pencilcase:{name:'Pencil Case',file:'Pencil case.jpg',phrase:'pencil case',className:'room-pencilcase'},
 table:{name:'Table',file:'table.jpg',phrase:'table',className:'room-table'},
 chair:{name:'Chair',file:'chair.jpg',phrase:'chair',className:'room-chair'},
 chair1:{name:'Chair 2',file:'chair1.jpg',phrase:'chair',className:'room-chair2'},
 bed:{name:'Bed',file:'bed.jpg',phrase:'bed',className:'room-bed'},
 teddy:{name:'Teddy Bear',file:'Taddybear.jpg',phrase:'teddy bear',className:'room-toy'},
 ball:{name:'Ball',file:'ball.jpg',phrase:'ball',className:'room-toy'},
 puppet:{name:'Puppet',file:'puppet.jpg',phrase:'puppet',className:'room-toy2'},
 yoyo:{name:'Yo-yo',file:'yoyo.jpg',phrase:'yo-yo',className:'room-toy2'},
 look1:{name:'Lily Look 1',file:'Lili green.jpg',phrase:"Lily's new look",className:'room-look'},
 look2:{name:'Lily Look 2',file:'Lili scool.jpg',phrase:"Lily's school look",className:'room-look'},
 look3:{name:'Lily Look 3',file:'Lili panda.jpg',phrase:"Lily's new look",className:'room-look'},
 cat:{name:'Cat',file:'cat.jpg',phrase:'cat',className:'room-pet'},
 dog:{name:'Dog',file:'dog.jpg',phrase:'dog',className:'room-pet'},
 unicorn:{name:'Unicorn',file:'',phrase:'unicorn',className:'room-pet',emoji:'🦄'}
};

function getItemData(key){
  const c=catalog[key];
  if(c)return c;
  const v=items[key];
  if(typeof v==='string')return {name:key,file:v,phrase:key,className:'room-toy'};
  if(v&&typeof v==='object')return {name:v.name||key,file:v.file||'',phrase:v.phrase||v.name||key,className:'room-toy'};
  return null;
}

function say(text){
  const b=document.getElementById('bubble');
  b.textContent=text;
  b.classList.add('show');
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=.78;u.pitch=1.08;
  speechSynthesis.speak(u);
  clearTimeout(window.bubbleTimer);
  window.bubbleTimer=setTimeout(()=>b.classList.remove('show'),3000);
}

function addObject(key,data,index){
  const el=document.createElement('button');
  el.className='room-item '+data.className;
  el.style.zIndex=4+index;
  el.onclick=()=>say("It's a "+data.phrase+"!");
  if(data.file){
    const img=document.createElement('img');
    img.src=data.file;img.alt=data.name;el.appendChild(img);
  }else{
    el.textContent=data.emoji||'🎁';
    el.style.fontSize='70px';
  }
  const label=document.createElement('span');
  label.className='label';label.textContent=data.name;el.appendChild(label);
  document.getElementById('objects').appendChild(el);
}

function render(){
  document.getElementById('roomBg').src=room;
  document.getElementById('roomBg').alt=roomName;
  const keys=owned.length?owned:Object.keys(items);
  const unique=[...new Set(keys)];
  const objects=document.getElementById('objects');objects.innerHTML='';
  const selected=document.getElementById('selected');selected.innerHTML='';
  if(!unique.length){
    const empty=document.createElement('div');empty.className='empty';empty.textContent='Choose gifts in Gift 🎁 and they will appear here.';selected.appendChild(empty);return;
  }
  unique.forEach((key,index)=>{
    const data=getItemData(key);if(!data)return;
    addObject(key,data,index);
    const tag=document.createElement('div');tag.className='tag';tag.textContent=data.name;selected.appendChild(tag);
  });
}

function goBack(){window.location.href='gift-shop.html'}
render();
</script>
</body>
</html>
