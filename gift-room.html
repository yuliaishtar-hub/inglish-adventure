<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lily's Gift Room 🎁</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#cfeeff,#f7d9ff 52%,#ffe1ee);color:#30305c}#app{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:30px;padding:24px;box-shadow:0 16px 40px #54317b22}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px;flex-wrap:wrap}.brand{font-size:30px;font-weight:900;color:#6339a6}.back{border:2px solid #d8c6f7;background:#fff;color:#6339a6;border-radius:16px;padding:12px 18px;font-weight:900;cursor:pointer}.room{position:relative;height:650px;border-radius:28px;overflow:hidden;background:#f7f4ff;border:5px solid #eadff8;touch-action:none}.room-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}.room-item{position:absolute;z-index:3;cursor:grab;transition:filter .15s;filter:drop-shadow(0 7px 6px #0003);border:0;background:transparent;padding:0;touch-action:none;user-select:none;-webkit-user-select:none}.room-item.dragging{cursor:grabbing;filter:drop-shadow(0 12px 10px #0004) brightness(1.08)}.room-item img{width:100%;height:100%;object-fit:contain;pointer-events:none}.room-item .label{position:absolute;left:50%;bottom:-25px;transform:translateX(-50%);background:#fff;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;color:#6339a6;white-space:nowrap;box-shadow:0 3px 10px #0002;pointer-events:none}.room-bag{width:100px;height:100px}.room-book,.room-pencilcase{width:90px;height:90px}.room-table{width:145px;height:125px}.room-chair,.room-chair2{width:100px;height:110px}.room-bed{width:180px;height:145px}.room-toy,.room-toy2{width:100px;height:100px}.room-pet{width:115px;height:115px}.room-look{width:125px;height:160px}.bubble{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border-radius:24px;padding:16px 24px;box-shadow:0 10px 30px #0002;text-align:center;font-size:24px;font-weight:900;display:none;z-index:20}.bubble.show{display:block}.selected{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px;justify-content:center}.tag{background:#f2ecff;border-radius:999px;padding:8px 12px;font-weight:800;color:#6339a6}.hint{text-align:center;margin-top:15px;color:#777;font-weight:800}@media(max-width:700px){.room{height:520px}.room-bag{width:70px;height:70px}.room-book,.room-pencilcase,.room-toy,.room-toy2{width:70px;height:70px}.room-table{width:105px;height:90px}.room-chair,.room-chair2{width:75px;height:85px}.room-bed{width:125px;height:105px}.room-pet{width:80px;height:80px}.room-look{width:90px;height:120px}}</style></head><body><div id="app"><div class="top"><div class="brand">🏡 Lily's Room</div><button class="back" onclick="goBack()">← Back to Gift</button></div><div class="card"><div class="room" id="room"><img id="roomBg" class="room-bg" src="bedroom.jpg"><div id="objects"></div><div id="bubble" class="bubble"></div></div><div id="selected" class="selected"></div><div class="hint">🖐️ Drag any item anywhere in the room. The position is saved automatically. Click to hear English. 🔊</div></div></div><script>
const ROOM_KEY='english_quest_room_v5';const saved=JSON.parse(localStorage.getItem(ROOM_KEY)||'{}');const room=saved.room||'bedroom.jpg',roomName=saved.roomName||'Bedroom';const owned=Array.isArray(saved.owned)?saved.owned:[];const items=saved.items||{};const positions=saved.positions||{};
const catalog={bag:['School Bag','School bag.jpg','school bag','room-bag'],book:['Book','book.jpg','book','room-book'],pencilcase:['Pencil Case','Pencil case.jpg','pencil case','room-pencilcase'],table:['Table','table.jpg','table','room-table'],chair:['Chair','chair.jpg','chair','room-chair'],chair1:['Chair 2','chair1.jpg','chair','room-chair2'],bed:['Bed','bed.jpg','bed','room-bed'],teddy:['Teddy Bear','Taddybear.jpg','teddy bear','room-toy'],ball:['Ball','ball.jpg','ball','room-toy'],puppet:['Puppet','puppet.jpg','puppet','room-toy2'],yoyo:['Yo-yo','yoyo.jpg','yo-yo','room-toy2'],look1:['Lily Look 1','Lili green.jpg',"Lily's new look",'room-look'],look2:['Lily Look 2','Lili scool.jpg',"Lily's school look",'room-look'],look3:['Lily Look 3','Lili panda.jpg',"Lily's new look",'room-look'],cat:['Cat','cat.jpg','cat','room-pet'],dog:['Dog','dog.jpg','dog','room-pet'],unicorn:['Unicorn','','unicorn','room-pet','🦄']};
const defaults={bag:[82,60],book:[25,65],pencilcase:[36,65],table:[12,78],chair:[30,78],chair1:[43,78],bed:[80,80],teddy:[48,35],ball:[60,35],puppet:[57,50],yoyo:[68,48],look1:[8,15],look2:[8,15],look3:[8,15],cat:[70,78],dog:[70,78],unicorn:[70,78]};
function data(key){if(catalog[key]){let c=catalog[key];return{name:c[0],file:c[1],phrase:c[2],className:c[3],emoji:c[4]}}let v=items[key];if(typeof v==='string')return{name:key,file:v,phrase:key,className:'room-toy'};if(v)return{name:v.name||key,file:v.file||'',phrase:v.phrase||v.name||key,className:'room-toy'};return null}
function say(text){let b=document.getElementById('bubble');b.textContent=text;b.classList.add('show');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.78;u.pitch=1.08;speechSynthesis.speak(u);clearTimeout(window.bt);window.bt=setTimeout(()=>b.classList.remove('show'),3000)}
function save(){saved.positions=positions;localStorage.setItem(ROOM_KEY,JSON.stringify(saved))}
function place(el,key){let p=positions[key]||defaults[key]||[50,50];el.style.left=p[0]+'%';el.style.top=p[1]+'%';el.style.transform='translate(-50%,-50%)'}
function drag(el,key,d){let active=false,moved=false,ox=0,oy=0;el.onpointerdown=e=>{e.preventDefault();active=true;moved=false;el.classList.add('dragging');el.setPointerCapture(e.pointerId);let r=el.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top};el.onpointermove=e=>{if(!active)return;let rr=document.getElementById('room').getBoundingClientRect();let x=Math.max(0,Math.min(rr.width-el.offsetWidth,e.clientX-rr.left-ox));let y=Math.max(0,Math.min(rr.height-el.offsetHeight,e.clientY-rr.top-oy));el.style.left=x/rr.width*100+'%';el.style.top=y/rr.height*100+'%';el.style.transform='none';positions[key]=[x/rr.width*100,y/rr.height*100];moved=true};el.onpointerup=e=>{if(!active)return;active=false;el.classList.remove('dragging');try{el.releasePointerCapture(e.pointerId)}catch(_){}if(moved)save();else say("It's a "+d.phrase+'!')};el.onpointercancel=()=>{active=false;el.classList.remove('dragging')}}
function add(key,d,i){let el=document.createElement('button');el.className='room-item '+d.className;el.style.zIndex=4+i;place(el,key);if(d.file){let im=document.createElement('img');im.src=d.file;im.alt=d.name;el.appendChild(im)}else{el.textContent=d.emoji||'🎁';el.style.fontSize='70px'}let lab=document.createElement('span');lab.className='label';lab.textContent=d.name;el.appendChild(lab);drag(el,key,d);document.getElementById('objects').appendChild(el)}
function render(){document.getElementById('roomBg').src=room;document.getElementById('roomBg').alt=roomName;let keys=[...new Set(owned.length?owned:Object.keys(items))];let o=document.getElementById('objects'),s=document.getElementById('selected');o.innerHTML='';s.innerHTML='';keys.forEach((k,i)=>{let d=data(k);if(!d)return;add(k,d,i);let t=document.createElement('div');t.className='tag';t.textContent=d.name;s.appendChild(t)})}function goBack(){location.href='gift-shop.html'}render();
</script></body></html>
